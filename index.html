<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据分析自学打卡 · 60天计划</title>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d38;--text:#e1e4eb;--sub:#8b8fa3;--accent:#4f8ff7;--done:#2ecc71;--warn:#f39c12;--danger:#e74c3c;--phase1:#4f8ff7;--phase2:#2ecc71;--phase3:#f39c12;--phase4:#e74c3c;--radius:10px;--shadow:0 2px 8px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
.container{max-width:720px;margin:0 auto;padding:16px}
header{text-align:center;padding:24px 0 16px}
header h1{font-size:1.5rem;font-weight:700;margin-bottom:4px}
header .subtitle{color:var(--sub);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.card-title{font-size:1.05rem;font-weight:700}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-phase1{background:rgba(79,143,247,.15);color:var(--phase1)}
.badge-phase2{background:rgba(46,204,113,.15);color:var(--phase2)}
.badge-phase3{background:rgba(243,156,18,.15);color:var(--phase3)}
.badge-phase4{background:rgba(231,76,60,.15);color:var(--phase4)}
.badge-done{background:rgba(46,204,113,.15);color:var(--done)}
.badge-roll{background:rgba(243,156,18,.15);color:var(--warn)}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat-item{background:var(--bg);border-radius:var(--radius);padding:14px;text-align:center}
.stat-value{font-size:1.5rem;font-weight:700}
.stat-label{font-size:.75rem;color:var(--sub);margin-top:2px}
.phase-bar{display:flex;gap:6px;margin-bottom:14px}
.phase-seg{height:6px;border-radius:3px;flex:1;background:var(--border);transition:background .3s}
.phase-seg.done{background:var(--done)}
.phase-seg.current{background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.task-list{list-style:none}
.task-item{display:flex;align-items:flex-start;gap:12px;padding:12px;border-radius:8px;margin-bottom:6px;background:var(--bg);border:1px solid transparent;transition:all .2s;cursor:pointer}
.task-item:hover{border-color:var(--border)}
.task-item.checked{opacity:.55}
.task-item.checked .task-text{text-decoration:line-through}
.task-item.rollover{border-left:3px solid var(--warn)}
.task-checkbox{flex-shrink:0;width:22px;height:22px;border:2px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .2s;margin-top:1px}
.task-checkbox.done{background:var(--done);border-color:var(--done)}
.task-checkbox.done::after{content:'✓';color:#fff;font-size:13px;font-weight:700}
.task-body{flex:1;min-width:0}
.task-text{font-size:.92rem;margin-bottom:4px}
.task-resource{font-size:.78rem;color:var(--accent)}
.task-resource a{color:var(--accent);text-decoration:none;border-bottom:1px dashed var(--accent)}
.task-resource a:hover{border-bottom-style:solid}
.task-time{font-size:.72rem;color:var(--sub)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;border-radius:8px;font-size:.9rem;font-weight:600;border:none;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.85;transform:translateY(-1px)}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:6px 14px;font-size:.8rem}
.btn-block{width:100%;justify-content:center;margin-top:8px}
.btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.actions-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.weekend-banner{background:rgba(243,156,18,.08);border:1px solid rgba(243,156,18,.2);border-radius:var(--radius);padding:16px;text-align:center;margin-bottom:14px}
.weekend-banner .icon{font-size:2rem;margin-bottom:6px}
.day-title-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.day-goal{font-size:.85rem;color:var(--sub);margin-bottom:12px;padding:8px 12px;background:rgba(79,143,247,.06);border-radius:6px;border-left:3px solid var(--accent)}
.section-label{font-size:.75rem;text-transform:uppercase;color:var(--sub);letter-spacing:.05em;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;max-width:380px;width:90%;text-align:center}
.modal h3{margin-bottom:12px}
.modal p{color:var(--sub);margin-bottom:20px;font-size:.9rem}
.modal-btns{display:flex;gap:10px;justify-content:center}
.empty-state{text-align:center;padding:40px 20px;color:var(--sub)}
.empty-state .icon{font-size:3rem;margin-bottom:12px}
.timer-display{font-size:.85rem;color:var(--sub);text-align:center;margin:8px 0;font-variant-numeric:tabular-nums}
@media(max-width:480px){
  .container{padding:10px}
  .card{padding:14px}
  .stats-row{grid-template-columns:repeat(2,1fr)}
  header h1{font-size:1.25rem}
}
</style>
</head>
<body>
<div class="container" id="app">
  <header>
    <h1>📊 数据分析自学打卡</h1>
    <div class="subtitle">60天 · 4个阶段 · Excel → SQL → AI → 实战</div>
  </header>

  <!-- 仪表盘 -->
  <div class="card" id="dashboard">
    <div class="stats-row">
      <div class="stat-item"><div class="stat-value" id="stat-day">1</div><div class="stat-label">当前第X天</div></div>
      <div class="stat-item"><div class="stat-value" id="stat-streak">0</div><div class="stat-label">连续打卡</div></div>
      <div class="stat-item"><div class="stat-value" id="stat-done">0</div><div class="stat-label">已完成天数</div></div>
      <div class="stat-item"><div class="stat-value" id="stat-rate">0%</div><div class="stat-label">完成率</div></div>
    </div>
    <div class="phase-bar" id="phaseBar"></div>
  </div>

  <!-- 当日课程 -->
  <div id="dailyContent"></div>

  <!-- 阶段导航 -->
  <div class="card" id="phaseNav">
    <div class="card-header"><span class="card-title">🗺️ 阶段导航</span></div>
    <div id="phaseList"></div>
  </div>
</div>

<!-- 签到弹窗 -->
<div class="modal-overlay" id="checkoutModal" style="display:none">
  <div class="modal">
    <h3>📝 今天学完了吗？</h3>
    <p id="modalMsg">你完成了 3/4 个任务。</p>
    <div class="modal-btns">
      <button class="btn btn-outline" id="btnNotDone">没学完</button>
      <button class="btn btn-primary" id="btnDone">学完了！</button>
    </div>
  </div>
</div>

<script>
// ==================== 课程数据 ====================
const CURRICULUM = [
  // ===== 阶段一: Excel进阶 (Day 1-15) =====
  {day:1,phase:1,title:'重新认识Excel',goal:'熟悉功能区布局,不再"找不到功能在哪"',tasks:[
    {text:'熟悉功能区布局：开始/插入/页面布局/公式/数据/审阅/视图，每个选项卡点开看一下里面有什么','res':'B站搜"Excel零基础入门"找播放量最高的视频','resUrl':'https://search.bilibili.com/all?keyword=Excel%E9%9B%B6%E5%9F%BA%E7%A1%80%E5%85%A5%E9%97%A8','time':'20分钟'},
    {text:'自定义快速访问工具栏：把你常用的3个功能（保存/撤销/筛选）加到左上角快速栏','res':'右键点击功能区→自定义快速访问工具栏','time':'10分钟'},
    {text:'练习工作簿/工作表操作：新建3个工作表，分别命名为"数据源""分析结果""图表"，学会移动和复制工作表','time':'20分钟'}
  ]},
  {day:2,phase:1,title:'数据输入与格式',goal:'能区分数据类型,会用Ctrl+E自动填充',tasks:[
    {text:'理解三种数据类型：文本(左对齐)、数字(右对齐)、日期。在单元格里分别输入"123"、123、2026-08-06，观察对齐方式的区别','time':'15分钟'},
    {text:'掌握单元格格式设置：选中单元格→右键→设置单元格格式→分别切换到数值/货币/日期/百分比，看预览效果','res':'B站搜"Excel单元格格式"','resUrl':'https://search.bilibili.com/all?keyword=Excel%E5%8D%95%E5%85%83%E6%A0%BC%E6%A0%BC%E5%BC%8F','time':'20分钟'},
    {text:'学会Ctrl+E快速填充：在一列旁边手打两行你想要的结果→选中→Ctrl+E→Excel自动补全剩下的。用这个功能把"张三13800138000"拆成"张三"和"13800138000"两列','res':'B站搜"Excel Ctrl+E 快速填充"','resUrl':'https://search.bilibili.com/all?keyword=Excel+Ctrl%2BE+%E5%BF%AB%E9%80%9F%E5%A1%AB%E5%85%85','time':'15分钟'}
  ]},
  {day:3,phase:1,title:'筛选与排序',goal:'能快速从一堆数据里筛出你想要的行',tasks:[
    {text:'学会自动筛选：选中数据区域→数据→筛选→点列头的下拉箭头,分别练习文本筛选(等于/包含/开头是)和数字筛选(大于/小于/介于)','time':'20分钟'},
    {text:'按颜色筛选：给一些单元格填色→筛选→按颜色筛选。这对审核内容的场景很有用','time':'10分钟'},
    {text:'自定义排序：数据→排序→添加多个条件。练习:先按"位数"排序,再按"价格"从大到小排','time':'15分钟'},
    {text:'用你的靓号数据练习：筛出含888的号、价格>100的号、5位且价格<200的号','time':'15分钟'}
  ]},
  {day:4,phase:1,title:'数据清洗-去重与分列',goal:'能把一团乱的表格整理成可分析的状态',tasks:[
    {text:'删除重复值：选中列→数据→删除重复项。试试单条件去重(只按ID去重)和多条件去重(按ID+日期同时相同才去重)','time':'15分钟'},
    {text:'文本分列：数据→分列→按分隔符(比如用逗号/空格/顿号分)或按固定宽度。把"2026-08-06 14:30"拆成日期和时间两列','time':'20分钟'},
    {text:'查找替换高级用法：Ctrl+H→替换空格/换行符(查找栏输入Alt+Enter)/特殊字符。把一段乱七八糟粘贴过来的文本整理干净','res':'B站搜"Excel查找替换技巧"','resUrl':'https://search.bilibili.com/all?keyword=Excel%E6%9F%A5%E6%89%BE%E6%9B%BF%E6%8D%A2%E6%8A%80%E5%B7%A7','time':'15分钟'},
    {text:'实战:拿你活动数据里回复用户的列表,找出重复用户,整理成干净的名单','time':'15分钟'}
  ]},
  {day:5,phase:1,title:'数据验证与条件格式',goal:'能设置输入限制,能用颜色一眼看出异常值',tasks:[
    {text:'数据验证：选中列→数据→数据验证→设置允许的条件(整数范围/下拉列表/日期限制)。做一个"活动类型"下拉列表:竞拍/折扣/打卡/节日','time':'15分钟'},
    {text:'条件格式-基础：开始→条件格式→突出显示单元格规则。把价格>180的标红,价格<50的标绿','time':'15分钟'},
    {text:'条件格式-进阶：数据条(看大小对比)、色阶(看分布)、图标集(加箭头)。给靓号价格列加上数据条,一眼看出价格梯度','res':'B站搜"Excel条件格式"','resUrl':'https://search.bilibili.com/all?keyword=Excel%E6%9D%A1%E4%BB%B6%E6%A0%BC%E5%BC%8F','time':'20分钟'},
    {text:'实战:给你的靓号定价表设条件格式——高价红/低价绿/含888的黄色高亮','time':'15分钟'}
  ]},
  {day:6,phase:1,title:'数据透视表-基础',goal:'今天学完,你能在1分钟内从原始数据里汇总出任何统计数字',tasks:[
    {text:'创建第一个透视表：选中数据→插入→数据透视表→确定。感受一下空白透视表的样子','time':'10分钟'},
    {text:'理解四个区域：把"活动日期"拖到行、把"用户ID"拖到值(选计数)、把"活动类型"拖到筛选器、把"价格"拖到值(选求和)。观察每个区域的效果','time':'25分钟'},
    {text:'切换汇总方式：值字段设置→分别试计数/求和/平均值/最大值/最小值','time':'15分钟'},
    {text:'练习:用你的活动数据透视出"每天参与人数"和"每天平均购买金额"','time':'20分钟'}
  ]},
  {day:7,phase:1,title:'数据透视表-进阶',goal:'掌握分组和切片器,能从不同维度切数据',tasks:[
    {text:'日期分组：把日期拖到行→右键→组合→按月/按季度分组。看活动参与人数的月度趋势','time':'20分钟'},
    {text:'数值分组：把价格拖到行→右键→组合→按区间(比如0-50/50-100/100-180/180+)分组。看各区间销量占比','time':'15分钟'},
    {text:'切片器：插入→切片器→选"活动类型"→点不同的活动类型,透视表自动切换。这是交互式分析的基础','res':'B站搜"Excel切片器"','resUrl':'https://search.bilibili.com/all?keyword=Excel%E5%88%87%E7%89%87%E5%99%A8','time':'15分钟'},
    {text:'练习:做一个带切片器的透视表,能一键切换看不同活动类型的参与人数对比','time':'20分钟'}
  ]},
  {day:8,phase:1,title:'数据透视表-实战',goal:'用透视表回答真实的业务问题',tasks:[
    {text:'学会计算字段：数据透视表分析→字段/项目/集→计算字段。创建一个"转化率"字段 = 购买人数/参与人数','res':'B站搜"数据透视表计算字段"','resUrl':'https://search.bilibili.com/all?keyword=%E6%95%B0%E6%8D%AE%E9%80%8F%E8%A7%86%E8%A1%A8%E8%AE%A1%E7%AE%97%E5%AD%97%E6%AE%B5','time':'20分钟'},
    {text:'用透视表回答3个问题:(1)哪类活动参与率最高?(2)哪个价位的靓号销量最好?(3)周末和平时参与率有差异吗?','time':'30分钟'},
    {text:'把你刚才分析的结果复制到一张新工作表,标注结论。这是你第一个"分析报告"的雏形','time':'20分钟'}
  ]},
  {day:9,phase:1,title:'常用函数-统计类',goal:'掌握5个核心统计函数',tasks:[
    {text:'SUM/AVERAGE/COUNT/COUNTA：在练习表里算总和/平均值/有数据的单元格数/非空单元格数。理解COUNT(只数数字)和COUNTA(数所有非空)的区别','time':'20分钟'},
    {text:'COUNTIF：条件计数。练习:"含888的靓号有多少个?""价格>100的有多少个?""5位的有多少个?"','time':'20分钟'},
    {text:'SUMIF：条件求和。练习:"含888靓号的总销售额?""某活动的总参与人数?"','time':'20分钟'},
    {text:'实战:用COUNTIF统计你靓号库里各种规律类型的数量(含888/顺子/豹子/AABB/普通)','time':'20分钟'}
  ]},
  {day:10,phase:1,title:'常用函数-查找类',goal:'学会VLOOKUP,能在两张表之间按ID匹配信息',tasks:[
    {text:'VLOOKUP精确匹配：=VLOOKUP(查找值,查找区域,返回第几列,FALSE)。练习:根据用户ID,从用户表里匹配出他的昵称和等级','res':'B站搜"VLOOKUP函数详解"','resUrl':'https://search.bilibili.com/all?keyword=VLOOKUP%E5%87%BD%E6%95%B0%E8%AF%A6%E8%A7%A3','time':'25分钟'},
    {text:'VLOOKUP近似匹配：=VLOOKUP(查找值,查找区域,返回列,TRUE)。练习:根据价格匹配折扣区间(0-50→无折扣,50-100→9折...)','time':'20分钟'},
    {text:'了解XLOOKUP：=XLOOKUP(查找值,查找列,返回列)。理解它比VLOOKUP好在哪(不用数第几列/可以向左查/找不到自动返回默认值)','time':'15分钟'},
    {text:'实战:用VLOOKUP把你活动参与名单里的用户ID匹配出他们的VIP等级','time':'20分钟'}
  ]},
  {day:11,phase:1,title:'常用函数-逻辑与文本',goal:'能写条件判断,能从文本里提取信息',tasks:[
    {text:'IF和IFS：=IF(条件,成立时的值,不成立时的值)。=IFS(条件1,值1,条件2,值2,条件3,值3)。练习:根据价格自动标注"引流款""主力款""利润款"','time':'20分钟'},
    {text:'LEFT/RIGHT/MID：从文本里截取。练习:从靓号里提取第3-5位、从日期文本"20260806"里提取月份','time':'15分钟'},
    {text:'TEXT：格式转换。练习:=TEXT(A1,"yyyy年mm月dd日")、=TEXT(B1,"#,##0")加千分位','time':'15分钟'},
    {text:'综合练习:用函数自动判断一个靓号属于哪种规律类型(提示:用MID提取数字→用IF判断是否是888/顺子/豹子)','time':'25分钟'}
  ]},
  {day:12,phase:1,title:'图表-基础',goal:'能做柱状图和折线图,把数据变成能看的图',tasks:[
    {text:'柱状图：选中数据→插入→柱状图。做一张"各活动类型参与人数对比"的柱状图。学会修改颜色/添加数据标签/调整间距','res':'B站搜"Excel图表制作基础"','resUrl':'https://search.bilibili.com/all?keyword=Excel%E5%9B%BE%E8%A1%A8%E5%88%B6%E4%BD%9C%E5%9F%BA%E7%A1%80','time':'25分钟'},
    {text:'折线图：做一张"月度销量趋势"的折线图。理解折线图适用于展示变化趋势,不适用于分类对比','time':'20分钟'},
    {text:'图表元素：给图表加标题/轴标签/数据标签/图例。理解每个元素的作用和使用场景','time':'15分钟'}
  ]},
  {day:13,phase:1,title:'图表-进阶',goal:'能做组合图和饼图,图表表达能力上一个台阶',tasks:[
    {text:'饼图：做一张"各规律类型占比"的饼图。注意:分类超过5个不要用饼图,改用柱状图','time':'15分钟'},
    {text:'组合图：柱状图+折线图放在一起。做一张图:柱子=每月销量,折线=每月均价。需要右键→更改图表类型→选择"组合"','res':'B站搜"Excel组合图"','resUrl':'https://search.bilibili.com/all?keyword=Excel%E7%BB%84%E5%90%88%E5%9B%BE','time':'25分钟'},
    {text:'迷你图：在一个单元格里插入微型图表(插入→迷你图)。在数据表旁边加上迷你趋势线,一眼看出每行数据的趋势','time':'15分钟'}
  ]},
  {day:14,phase:1,title:'Excel综合实战(一)',goal:'全流程:拿到脏数据→清洗→透视→函数→图表→结论,30分钟内完成',tasks:[

// ==================== 状态管理 ====================
const STORAGE_KEY = 'data_learning_tracker_state';

function defaultState(){
  return {
    currentDay:1,           // 当前学习日 1-60
    completedDays:{},       // {dayNum:true}
    rolloverTasks:[],       // [{dayNum,text,res,resUrl,time}]
    todayCheckedIn:false,
    todayTaskStatus:{},     // {"dayNum-taskIdx":"done"|"undone"}
    streak:0,
    lastActiveDate:null,    // 'YYYY-MM-DD'
    totalDone:0,
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const s = JSON.parse(raw);
      // 合并默认值,处理版本升级
      const def = defaultState();
      for(const k of Object.keys(def)){
        if(!(k in s)) s[k]=def[k];
      }
      return s;
    }
  }catch(e){}
  return defaultState();
}

function saveState(state){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// ==================== 工具函数 ====================
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function dayOfWeek(){
  return new Date().getDay(); // 0=Sun, 6=Sat
}

function isWeekend(){
  const d = dayOfWeek();
  return d===0 || d===6;
}

function getDayData(dayNum){
  return CURRICULUM.find(d=>d.day===dayNum) || null;
}

function getPhaseName(phase){
  const names={1:'阶段一:Excel进阶',2:'阶段二:SQL基础',3:'阶段三:AI辅助分析',4:'阶段四:项目实战'};
  return names[phase]||'';
}

function getPhaseColor(phase){
  const colors={1:'phase1',2:'phase2',3:'phase3',4:'phase4'};
  return colors[phase]||'phase1';
}

function getDaysInPhase(phase){
  return CURRICULUM.filter(d=>d.phase===phase).length;
}

function getCompletedDaysInPhase(phase, completedDays){
  return CURRICULUM.filter(d=>d.phase===phase && completedDays[d.day]).length;
}

// ==================== 渲染 ====================
let state = loadState();

function renderAll(){
  checkNewDay();
  renderDashboard();
  renderDailyContent();
  renderPhaseNav();
}

function checkNewDay(){
  const now = todayStr();
  if(state.lastActiveDate && state.lastActiveDate !== now){
    // 新的一天
    if(!state.todayCheckedIn){
      // 昨天没打卡,重置当日状态
      // 但保留未完成的任务作为rollover
      const undoneTasks = [];
      const prevDayData = getDayData(state.currentDay);
      if(prevDayData){
        prevDayData.tasks.forEach((t,i)=>{
          const key = `${state.currentDay}-${i}`;
          if(state.todayTaskStatus[key] !== 'done'){
            undoneTasks.push({...t, fromDay:state.currentDay});
          }
        });
      }
      // 如果有未完成任务,加入rollover
      if(undoneTasks.length>0){
        state.rolloverTasks = [...undoneTasks, ...state.rolloverTasks.filter(r=>r.fromDay!==state.currentDay)];
      }
      // 如果昨天完成了所有任务,推进到下一天
      const allDone = prevDayData ? prevDayData.tasks.every((t,i)=>{
        return state.todayTaskStatus[`${state.currentDay}-${i}`]==='done';
      }) : true;
      if(allDone && state.currentDay < 60){
        state.currentDay++;
      }
      state.todayCheckedIn = false;
      state.todayTaskStatus = {};
    }
  }
  state.lastActiveDate = now;
  saveState(state);
}

function renderDashboard(){
  const d = getDayData(state.currentDay);
  const phase = d ? d.phase : 1;
  document.getElementById('stat-day').textContent = state.currentDay;
  document.getElementById('stat-streak').textContent = state.streak;
  document.getElementById('stat-done').textContent = Object.keys(state.completedDays).length;
  document.getElementById('stat-rate').textContent = Math.round(Object.keys(state.completedDays).length/60*100)+'%';

  // 阶段进度条
  const bar = document.getElementById('phaseBar');
  bar.innerHTML = '';
  for(let p=1;p<=4;p++){
    const seg = document.createElement('div');
    seg.className = 'phase-seg';
    const total = getDaysInPhase(p);
    const done = getCompletedDaysInPhase(p, state.completedDays);
    if(done===total && total>0) seg.classList.add('done');
    if(p===phase) seg.classList.add('current');
    seg.title = `${getPhaseName(p)}: ${done}/${total}`;
    bar.appendChild(seg);
  }
}

function renderDailyContent(){
  const container = document.getElementById('dailyContent');
  const d = getDayData(state.currentDay);
  const phase = d ? d.phase : 1;
  const weekend = isWeekend();

  let html = '';

  // 周末提示
  if(weekend){
    html += `<div class="card weekend-banner">
      <div class="icon">☕</div>
      <strong>弹性日</strong><br>
      <span style="color:var(--sub);font-size:.85rem">今天是周末,没有排新内容。补上本周未完成的任务,或者给自己放个假。</span>
    </div>`;
  }

  // 主课程卡片
  html += `<div class="card">
    <div class="card-header">
      <div class="day-title-row">
        <span class="badge badge-phase${phase}">${getPhaseName(phase)}</span>
        <span class="card-title">Day ${state.currentDay}${weekend?' · 弹性日':''}: ${d?d.title:'自由练习'}</span>
      </div>
      ${state.todayCheckedIn ? '<span class="badge badge-done">已签到</span>' : ''}
    </div>`;

  if(d && d.goal){
    html += `<div class="day-goal">🎯 ${d.goal}</div>`;
  }

  // Rollover任务
  if(state.rolloverTasks.length>0){
    html += `<div class="section-label">📌 昨天未完成的任务</div><ul class="task-list">`;
    state.rolloverTasks.forEach((t,i)=>{
      html += renderTaskItem(t, `rollover-${i}`, true);
    });
    html += `</ul>`;
  }

  // 当日任务
  if(!weekend && d){
    html += `<div class="section-label">📋 今日任务</div><ul class="task-list">`;
    d.tasks.forEach((t,i)=>{
      const key = `${state.currentDay}-${i}`;
      html += renderTaskItem(t, key, false);
    });
    html += `</ul>`;
  }else if(weekend && state.rolloverTasks.length===0){
    html += `<div class="empty-state">
      <div class="icon">🎉</div>
      <p>没有积压任务！休息一下,或者回顾本周学过的内容。</p>
    </div>`;
  }

  // 操作按钮
  html += `<div class="timer-display" id="timerDisplay" style="display:none">⏱️ 学习中...</div>`;
  html += `<div class="actions-row">`;
  if(!state.todayCheckedIn){
    html += `<button class="btn btn-primary btn-block" id="btnCheckin" onclick="checkin()">📖 开始学习</button>`;
  }else{
    html += `<button class="btn btn-outline btn-block" id="btnCheckout" onclick="checkout()">✅ 结束学习</button>`;
  }
  html += `</div>`;

  // 跳过按钮(周末或弹性日)
  if(weekend && state.rolloverTasks.length===0){
    html += `<div class="actions-row" style="margin-top:6px">
      <button class="btn btn-outline btn-sm btn-block" onclick="skipDay()">跳过今天(标记完成)</button>
    </div>`;
  }

  html += `</div>`;

  container.innerHTML = html;

  // 恢复任务勾选状态
  if(d){
    d.tasks.forEach((t,i)=>{
      const key = `${state.currentDay}-${i}`;
      if(state.todayTaskStatus[key]==='done'){
        const el = document.getElementById(`task-${key}`);
        if(el) el.classList.add('checked');
        const cb = document.getElementById(`cb-${key}`);
        if(cb) cb.classList.add('done');
      }
    });
  }
}

function renderTaskItem(t, key, isRollover){
  const done = state.todayTaskStatus[key]==='done';
  return `<li class="task-item${done?' checked':''}${isRollover?' rollover':''}" id="task-${key}" onclick="toggleTask('${key}')">
    <div class="task-checkbox${done?' done':''}" id="cb-${key}"></div>
    <div class="task-body">
      <div class="task-text">${t.text}</div>
      ${t.res ? `<div class="task-resource">${t.resUrl ? `<a href="${t.resUrl}" target="_blank" onclick="event.stopPropagation()">${t.res}</a>` : t.res}</div>` : ''}
      ${t.time ? `<div class="task-time">⏱️ 预计${t.time}</div>` : ''}
    </div>
  </li>`;
}

function renderPhaseNav(){
  const container = document.getElementById('phaseList');
  let html = '';
  for(let p=1;p<=4;p++){
    const total = getDaysInPhase(p);
    const done = getCompletedDaysInPhase(p, state.completedDays);
    const isCurrent = getDayData(state.currentDay)?.phase === p;
    html += `<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)">
      <span class="badge badge-${getPhaseColor(p)}">${getPhaseName(p)}</span>
      <span style="flex:1;font-size:.85rem">${done}/${total} 天完成</span>
      ${isCurrent ? '<span style="color:var(--accent);font-size:.75rem">← 当前</span>' : ''}
    </div>`;
  }
  container.innerHTML = html;
}

// ==================== 交互 ====================
function toggleTask(key){
  if(!state.todayCheckedIn) return; // 还没签到,不能操作
  if(state.todayTaskStatus[key]==='done'){
    state.todayTaskStatus[key] = 'undone';
  }else{
    state.todayTaskStatus[key] = 'done';
  }
  saveState(state);
  renderDailyContent();
}

function checkin(){
  state.todayCheckedIn = true;
  state.streak = (state.streak||0) + 1;
  saveState(state);
  renderDailyContent();
  // 启动计时器
  let seconds = 0;
  const timerEl = document.getElementById('timerDisplay');
  if(timerEl){
    timerEl.style.display = 'block';
    const interval = setInterval(()=>{
      seconds++;
      const m = Math.floor(seconds/60);
      const s = seconds%60;
      timerEl.textContent = `⏱️ 学习中: ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    },1000);
    timerEl._interval = interval;
  }
}

function checkout(){
  const d = getDayData(state.currentDay);
  if(!d) return;

  const totalTasks = d.tasks.length;
  let doneCount = 0;
  d.tasks.forEach((t,i)=>{
    const key = `${state.currentDay}-${i}`;
    if(state.todayTaskStatus[key]==='done') doneCount++;
  });

  // 停止计时器
  const timerEl = document.getElementById('timerDisplay');
  if(timerEl && timerEl._interval){
    clearInterval(timerEl._interval);
    timerEl.style.display = 'none';
    const studyMin = Math.floor((timerEl.textContent.match(/(\d+):(\d+)/)||['','0','0']).slice(1).reduce((a,b)=>parseInt(a)*60+parseInt(b),0)/60);
    state.totalStudyMinutes = (state.totalStudyMinutes||0) + studyMin;
  }

  // 弹窗
  const modal = document.getElementById('checkoutModal');
  const msg = document.getElementById('modalMsg');
  msg.textContent = `你完成了 ${doneCount}/${totalTasks} 个任务。`;
  modal.style.display = 'flex';

  document.getElementById('btnDone').onclick = ()=>{
    // 学完了
    state.completedDays[state.currentDay] = true;
    state.todayCheckedIn = false;
    state.todayTaskStatus = {};
    state.rolloverTasks = []; // 清空rollover

    // RLOVER tasks: clear all rollover items
    // 保存完成状态
    saveState(state);

    // 推进到下一天
    if(state.currentDay < 60){
      state.currentDay++;
    }
    saveState(state);
    modal.style.display = 'none';
    renderAll();
  };

  document.getElementById('btnNotDone').onclick = ()=>{
    // 没学完——未完成的任务滚到明天
    const undone = [];
    d.tasks.forEach((t,i)=>{
      const key = `${state.currentDay}-${i}`;
      if(state.todayTaskStatus[key]!=='done'){
        undone.push({...t, fromDay:state.currentDay});
      }
    });

    // 标记当天为非完成(即使部分完成也不标记)
    // 未完成任务加到rollover
    state.rolloverTasks = [...state.rolloverTasks.filter(r=>r.fromDay!==state.currentDay), ...undone];
    state.todayCheckedIn = false;
    state.todayTaskStatus = {};
    state.streak = Math.max(0,(state.streak||1)-1);

    if(state.currentDay < 60){
      state.currentDay++;
    }
    saveState(state);
    modal.style.display = 'none';
    renderAll();
  };
}

function skipDay(){
  // 跳过周末/弹性日
  state.completedDays[state.currentDay] = true;
  state.todayCheckedIn = false;
  state.todayTaskStatus = {};
  state.rolloverTasks = [];
  if(state.currentDay < 60){
    state.currentDay++;
  }
  saveState(state);
  renderAll();
}

// 关闭弹窗(点击背景)
document.getElementById('checkoutModal').addEventListener('click', function(e){
  if(e.target === this){
    this.style.display = 'none';
  }
});

// ==================== 初始化 ====================
renderAll();

console.log('📊 数据分析自学打卡系统已就绪');
console.log(`当前: Day ${state.currentDay} | 已完成: ${Object.keys(state.completedDays).length}/60 | 连续: ${state.streak}天`);
console.log('数据存储在浏览器 localStorage,不会丢失');
