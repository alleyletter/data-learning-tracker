<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据分析自学打卡 · 60天计划</title>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2d38;--text:#e1e4eb;--sub:#8b8fa3;--accent:#4f8ff7;--done:#2ecc71;--warn:#f39c12;--danger:#e74c3c;--phase1:#4f8ff7;--phase2:#2ecc71;--phase3:#f39c12;--phase4:#e74c3c;--radius:10px;--shadow:0 2px 8px rgba(0,0,0,.3)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
.container{max-width:720px;margin:0 auto;padding:16px}
header{text-align:center;padding:24px 0 16px}
header h1{font-size:1.5rem;font-weight:700;margin-bottom:4px}
header .subtitle{color:var(--sub);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.card-title{font-size:1.05rem;font-weight:700}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-phase1{background:rgba(79,143,247,.15);color:var(--phase1)}
.badge-phase2{background:rgba(46,204,113,.15);color:var(--phase2)}
.badge-phase3{background:rgba(243,156,18,.15);color:var(--phase3)}
.badge-phase4{background:rgba(231,76,60,.15);color:var(--phase4)}
.badge-done{background:rgba(46,204,113,.15);color:var(--done)}
.badge-roll{background:rgba(243,156,18,.15);color:var(--warn)}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat-item{background:var(--bg);border-radius:var(--radius);padding:14px;text-align:center}
.stat-value{font-size:1.5rem;font-weight:700}
.stat-label{font-size:.75rem;color:var(--sub);margin-top:2px}
.phase-bar{display:flex;gap:6px;margin-bottom:14px}
.phase-seg{height:6px;border-radius:3px;flex:1;background:var(--border);transition:background .3s}
.phase-seg.done{background:var(--done)}
.phase-seg.current{background:var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.task-list{list-style:none}
.task-item{display:flex;align-items:flex-start;gap:12px;padding:12px;border-radius:8px;margin-bottom:6px;background:var(--bg);border:1px solid transparent;transition:all .2s;cursor:pointer}
.task-item:hover{border-color:var(--border)}
.task-item.checked{opacity:.55}
.task-item.checked .task-text{text-decoration:line-through}
.task-item.rollover{border-left:3px solid var(--warn)}
.task-checkbox{flex-shrink:0;width:22px;height:22px;border:2px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .2s;margin-top:1px}
.task-checkbox.done{background:var(--done);border-color:var(--done)}
.task-checkbox.done::after{content:'✓';color:#fff;font-size:13px;font-weight:700}
.task-body{flex:1;min-width:0}
.task-text{font-size:.92rem;margin-bottom:4px}
.task-resource{font-size:.78rem;color:var(--accent)}
.task-resource a{color:var(--accent);text-decoration:none;border-bottom:1px dashed var(--accent)}
.task-resource a:hover{border-bottom-style:solid}
.task-time{font-size:.72rem;color:var(--sub)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;border-radius:8px;font-size:.9rem;font-weight:600;border:none;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.85;transform:translateY(-1px)}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-sm{padding:6px 14px;font-size:.8rem}
.btn-block{width:100%;justify-content:center;margin-top:8px}
.btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.actions-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.weekend-banner{background:rgba(243,156,18,.08);border:1px solid rgba(243,156,18,.2);border-radius:var(--radius);padding:16px;text-align:center;margin-bottom:14px}
.weekend-banner .icon{font-size:2rem;margin-bottom:6px}
.day-title-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.day-goal{font-size:.85rem;color:var(--sub);margin-bottom:12px;padding:8px 12px;background:rgba(79,143,247,.06);border-radius:6px;border-left:3px solid var(--accent)}
.section-label{font-size:.75rem;text-transform:uppercase;color:var(--sub);letter-spacing:.05em;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:28px;max-width:380px;width:90%;text-align:center}
.modal h3{margin-bottom:12px}
.modal p{color:var(--sub);margin-bottom:20px;font-size:.9rem}
.modal-btns{display:flex;gap:10px;justify-content:center}
.empty-state{text-align:center;padding:40px 20px;color:var(--sub)}
.empty-state .icon{font-size:3rem;margin-bottom:12px}
.timer-display{font-size:.85rem;color:var(--sub);text-align:center;margin:8px 0;font-variant-numeric:tabular-nums}
@media(max-width:480px){
  .container{padding:10px}
  .card{padding:14px}
  .stats-row{grid-template-columns:repeat(2,1fr)}
  header h1{font-size:1.25rem}
}
/* 测验样式 */
.quiz-question{margin-bottom:16px;text-align:left}
.quiz-q-text{font-weight:600;margin-bottom:8px;font-size:.92rem}
.quiz-option{display:block;width:100%;text-align:left;padding:10px 14px;margin-bottom:6px;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-size:.88rem;cursor:pointer;transition:all .15s}
.quiz-option:hover{border-color:var(--accent);background:rgba(79,143,247,.06)}
.quiz-option.selected{border-color:var(--accent);background:rgba(79,143,247,.12);color:var(--accent);font-weight:600}
.quiz-option.correct{border-color:var(--done);background:rgba(46,204,113,.12);color:var(--done)}
.quiz-option.wrong{border-color:var(--danger);background:rgba(231,76,60,.08);color:var(--danger)}
.quiz-result{padding:10px 14px;border-radius:8px;margin-top:8px;font-size:.82rem}
.quiz-result.pass{background:rgba(46,204,113,.1);color:var(--done)}
.quiz-result.fail{background:rgba(231,76,60,.1);color:var(--danger)}
.quiz-score{font-size:2rem;font-weight:800;text-align:center;margin:12px 0}
.quiz-explain{font-size:.8rem;color:var(--sub);margin-top:4px;padding:8px;background:rgba(79,143,247,.06);border-radius:6px}
.modal-wide{max-width:560px!important;max-height:85vh;overflow-y:auto}
/* 教程折叠面板 */
.tutorial-toggle{display:flex;align-items:center;gap:8px;width:100%;padding:10px 14px;margin-bottom:12px;background:rgba(79,143,247,.06);border:1px dashed var(--accent);border-radius:8px;color:var(--accent);font-size:.88rem;font-weight:600;cursor:pointer;text-align:left;transition:all .15s}
.tutorial-toggle:hover{background:rgba(79,143,247,.12)}
.tutorial-toggle .arrow{transition:transform .2s;font-size:.7rem}
.tutorial-toggle.open .arrow{transform:rotate(90deg)}
.tutorial-body{padding:0 0 12px 0}
.tutorial-section{margin-bottom:14px}
.tutorial-section h4{font-size:.9rem;color:var(--text);margin-bottom:6px;padding-left:4px;border-left:3px solid var(--accent)}
.tutorial-section p{font-size:.85rem;color:var(--sub);line-height:1.7;margin:0;padding-left:7px}
.tutorial-section p code{background:rgba(79,143,247,.1);color:var(--accent);padding:1px 6px;border-radius:3px;font-size:.82rem}
.tutorial-section p strong{color:var(--text)}
/* 复习模式 */
.review-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;margin-bottom:12px;background:rgba(243,156,18,.1);border:1px solid rgba(243,156,18,.25);border-radius:8px;font-size:.85rem;flex-wrap:wrap}
.review-banner .label{color:var(--warn);font-weight:600}
.review-entry-btn{display:block;width:100%;text-align:center;padding:8px;margin-top:8px;background:transparent;border:1px dashed var(--border);border-radius:6px;color:var(--sub);font-size:.82rem;cursor:pointer;transition:all .15s}
.review-entry-btn:hover{border-color:var(--accent);color:var(--accent)}
.review-list{margin-top:8px}
.review-list-item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;font-size:.84rem;cursor:pointer;transition:background .15s}
.review-list-item:hover{background:var(--bg)}
.review-list-item.current{color:var(--sub);cursor:default;font-weight:600}
/* 阶段预览 */
.phase-row{cursor:pointer;user-select:none;transition:background .15s}
.phase-row:hover{background:var(--bg)}
.phase-days{margin-top:4px;padding-left:12px}
.phase-day-item{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:6px;font-size:.82rem;cursor:pointer;transition:background .15s;color:var(--sub)}
.phase-day-item:hover{background:var(--bg);color:var(--text)}
.phase-day-item.completed{color:var(--done)}
.phase-day-item.current{color:var(--accent);font-weight:600;background:rgba(79,143,247,.06)}
.phase-day-item .day-icons{font-size:.7rem;margin-left:auto}
/* 里程碑 */
.streak-milestone{text-align:center;font-size:.82rem;padding:8px;margin-top:6px;border-radius:6px;background:rgba(243,156,18,.06);color:var(--warn);animation:fadeInUp .5s ease}
@keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* 勾选弹跳 */
@keyframes bounce{0%{transform:scale(1)}30%{transform:scale(1.55)}50%{transform:scale(.85)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.task-checkbox.bouncing{animation:bounce .5s ease}
.task-checkbox.done{animation:popIn .35s ease}
@keyframes popIn{0%{transform:scale(1)}50%{transform:scale(1.5)}100%{transform:scale(1)}}
/* 计时器环 */
.timer-ring-wrap{display:flex;align-items:center;justify-content:center;gap:14px;margin:12px 0}
.timer-ring{position:relative;width:60px;height:60px}
.timer-ring svg{transform:rotate(-90deg)}
.timer-ring-bg{fill:none;stroke:var(--border);stroke-width:4}
.timer-ring-fill{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .8s linear}
.timer-ring-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
/* 撒花 */
.confetti-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:200;overflow:hidden}
.confetti-piece{position:absolute;width:8px;height:8px;border-radius:2px;animation:confettiFall 1.2s ease-out forwards}
@keyframes confettiFall{0%{opacity:1;transform:translateY(0) rotate(0deg) scale(1)}100%{opacity:0;transform:translateY(400px) rotate(720deg) scale(.3)}}
</style>
</head>
<body>
<div class="container" id="app">
  <header>
    <h1>📊 数据分析自学打卡</h1>
    <div class="subtitle">60天 · 4个阶段 · Excel → SQL → AI → 实战</div>
  </header>

  <!-- 仪表盘 -->
  <div class="card" id="dashboard">
    <div class="stats-row">
      <div class="stat-item"><div class="stat-value" id="stat-day">1</div><div class="stat-label">当前第X天</div></div>
      <div class="stat-item"><div class="stat-value" id="stat-streak">0</div><div class="stat-label">连续打卡</div></div>
      <div class="stat-item"><div class="stat-value" id="stat-done">0</div><div class="stat-label">已完成天数</div></div>
      <div class="stat-item"><div class="stat-value" id="stat-rate">0%</div><div class="stat-label">完成率</div></div>
    </div>
    <div class="phase-bar" id="phaseBar"></div>
    <div id="reviewEntry"></div>
    <div id="streakMilestone"></div>
  </div>

  <!-- 撒花容器 -->
  <div id="confettiContainer" class="confetti-container"></div>

  <!-- 复习提示条 -->
  <div id="reviewBanner"></div>

  <!-- 当日课程 -->
  <div id="dailyContent"></div>

  <!-- 阶段导航 -->
  <div class="card" id="phaseNav">
    <div class="card-header"><span class="card-title">🗺️ 阶段导航</span></div>
    <div id="phaseList"></div>
  </div>
</div>

<!-- 签到弹窗 -->
<div class="modal-overlay" id="checkoutModal" style="display:none">
  <div class="modal">
    <h3>📝 今天学完了吗？</h3>
    <p id="modalMsg">你完成了 3/4 个任务。</p>
    <div class="modal-btns">
      <button class="btn btn-outline" id="btnNotDone">没学完</button>
      <button class="btn btn-primary" id="btnDone">学完了！</button>
    </div>
  </div>
</div>

<!-- 测验弹窗 -->
<div class="modal-overlay" id="quizModal" style="display:none">
  <div class="modal modal-wide">
    <h3 id="quizTitle">📝 今日测验</h3>
    <p id="quizSub" style="color:var(--sub);font-size:.8rem;margin-bottom:16px">共 X 题，答对 Y 题(≥70%)即可通关</p>
    <div id="quizQuestions"></div>
    <div id="quizResult" style="display:none"></div>
    <div class="modal-btns" id="quizBtns" style="margin-top:16px">
      <button class="btn btn-outline" id="btnQuizSkip" style="font-size:.8rem">跳过测验(标记未完成)</button>
      <button class="btn btn-primary" id="btnQuizSubmit" disabled>提交答案</button>
    </div>
  </div>
</div>

<script>
// ==================== 课程数据 ====================
const CURRICULUM = [
  // ===== 阶段一: Excel进阶 (Day 1-15) =====
  {day:1,phase:1,title:'重新认识Excel',goal:'熟悉功能区布局,不再"找不到功能在哪"',tasks:[
    {text:'熟悉功能区布局：开始/插入/页面布局/公式/数据/审阅/视图，每个选项卡点开看一下里面有什么','res':'B站搜"Excel零基础入门"找播放量最高的视频','resUrl':'https://search.bilibili.com/all?keyword=Excel%E9%9B%B6%E5%9F%BA%E7%A1%80%E5%85%A5%E9%97%A8','time':'20分钟'},
    {text:'自定义快速访问工具栏：把你常用的3个功能（保存/撤销/筛选）加到左上角快速栏','res':'右键点击功能区→自定义快速访问工具栏','time':'10分钟'},
    {text:'练习工作簿/工作表操作：新建3个工作表，分别命名为"数据源""分析结果""图表"，学会移动和复制工作表','time':'20分钟'}
  ]},
  {day:2,phase:1,title:'数据输入与格式',goal:'能区分数据类型,会用Ctrl+E自动填充',tasks:[
    {text:'理解三种数据类型：文本(左对齐)、数字(右对齐)、日期。在单元格里分别输入"123"、123、2026-08-06，观察对齐方式的区别','time':'15分钟'},
    {text:'掌握单元格格式设置：选中单元格→右键→设置单元格格式→分别切换到数值/货币/日期/百分比，看预览效果','res':'B站搜"Excel单元格格式"','resUrl':'https://search.bilibili.com/all?keyword=Excel%E5%8D%95%E5%85%83%E6%A0%BC%E6%A0%BC%E5%BC%8F','time':'20分钟'},
    {text:'学会Ctrl+E快速填充：在一列旁边手打两行你想要的结果→选中→Ctrl+E→Excel自动补全剩下的。用这个功能把"张三13800138000"拆成"张三"和"13800138000"两列','res':'B站搜"Excel Ctrl+E 快速填充"','resUrl':'https://search.bilibili.com/all?keyword=Excel+Ctrl%2BE+%E5%BF%AB%E9%80%9F%E5%A1%AB%E5%85%85','time':'15分钟'}
  ]},
  {day:3,phase:1,title:'筛选与排序',goal:'能快速从一堆数据里筛出你想要的行',tasks:[
    {text:'学会自动筛选：选中数据区域→数据→筛选→点列头的下拉箭头,分别练习文本筛选(等于/包含/开头是)和数字筛选(大于/小于/介于)','time':'20分钟'},
    {text:'按颜色筛选：给一些单元格填色→筛选→按颜色筛选。这对审核内容的场景很有用','time':'10分钟'},
    {text:'自定义排序：数据→排序→添加多个条件。练习:先按"位数"排序,再按"价格"从大到小排','time':'15分钟'},
    {text:'用你的靓号数据练习：筛出含888的号、价格>100的号、5位且价格<200的号','time':'15分钟'}
  ]},
  {day:4,phase:1,title:'数据清洗-去重与分列',goal:'能把一团乱的表格整理成可分析的状态',tasks:[
    {text:'删除重复值：选中列→数据→删除重复项。试试单条件去重(只按ID去重)和多条件去重(按ID+日期同时相同才去重)','time':'15分钟'},
    {text:'文本分列：数据→分列→按分隔符(比如用逗号/空格/顿号分)或按固定宽度。把"2026-08-06 14:30"拆成日期和时间两列','time':'20分钟'},
    {text:'查找替换高级用法：Ctrl+H→替换空格/换行符(查找栏输入Alt+Enter)/特殊字符。把一段乱七八糟粘贴过来的文本整理干净','res':'B站搜"Excel查找替换技巧"','resUrl':'https://search.bilibili.com/all?keyword=Excel%E6%9F%A5%E6%89%BE%E6%9B%BF%E6%8D%A2%E6%8A%80%E5%B7%A7','time':'15分钟'},
    {text:'实战:拿你活动数据里回复用户的列表,找出重复用户,整理成干净的名单','time':'15分钟'}
  ]},
  {day:5,phase:1,title:'数据验证与条件格式',goal:'能设置输入限制,能用颜色一眼看出异常值',tasks:[
    {text:'数据验证：选中列→数据→数据验证→设置允许的条件(整数范围/下拉列表/日期限制)。做一个"活动类型"下拉列表:竞拍/折扣/打卡/节日','time':'15分钟'},
    {text:'条件格式-基础：开始→条件格式→突出显示单元格规则。把价格>180的标红,价格<50的标绿','time':'15分钟'},
    {text:'条件格式-进阶：数据条(看大小对比)、色阶(看分布)、图标集(加箭头)。给靓号价格列加上数据条,一眼看出价格梯度','res':'B站搜"Excel条件格式"','resUrl':'https://search.bilibili.com/all?keyword=Excel%E6%9D%A1%E4%BB%B6%E6%A0%BC%E5%BC%8F','time':'20分钟'},
    {text:'实战:在"靓号定价(备用实战)"工作表设条件格式——价格>180红/<50绿(突出显示→大于/小于)；含888的靓号ID标黄(突出显示→文本包含→888)；位数列5红6橙7黄8绿(4条"等于"规则)。注意:高亮是条件格式的活,数据验证只限制输入不能标色','time':'15分钟'}
  ]},
  {day:6,phase:1,title:'数据透视表-基础',goal:'今天学完,你能在1分钟内从原始数据里汇总出任何统计数字',tasks:[
    {text:'创建第一个透视表：选中数据→插入→数据透视表→确定。感受一下空白透视表的样子','time':'10分钟'},
    {text:'理解四个区域：把"活动日期"拖到行、把"用户ID"拖到值(选计数)、把"活动类型"拖到筛选器、把"价格"拖到值(选求和)。观察每个区域的效果','time':'25分钟'},
    {text:'切换汇总方式：值字段设置→分别试计数/求和/平均值/最大值/最小值','time':'15分钟'},
    {text:'练习:用你的活动数据透视出"每天参与人数"和"每天平均购买金额"','time':'20分钟'}
  ]},
  {day:7,phase:1,title:'数据透视表-进阶',goal:'掌握分组和切片器,能从不同维度切数据',tasks:[
    {text:'日期分组：把日期拖到行→右键→组合→按月/按季度分组。看活动参与人数的月度趋势','time':'20分钟'},

{q:'Ctrl+E（智能填充）什么时候会失灵？补完之后一定要做什么？',a:'数据没有统一规律时会补出错误结果。所以补完之后必须扫一眼全部结果，不对的单元格手动改。'}
],
3:[
{q:'筛选和排序的本质区别是什么？发报告给同事前应该用哪个？',a:'筛选只是"隐藏"不符合条件的行，数据还在原位；排序是真正"重新排列"行的顺序。发报告前先排好序，别人打开一眼就能看懂。'},
{q:'多条件排序"先按位数升序、再按价格降序"，Excel是怎么排的？',a:'先按位数分组排，位数相同的行内部再按价格从大到小排。是"先主后次"的关系，不是两个条件混合成一次排序。'}
],
4:[
{q:'去重时勾一列和勾两列有什么区别？给发奖名单去重应该勾什么？',a:'勾一列=该列内容重复就删；勾两列=两列同时相同才视为重复。发奖名单按"用户ID"单列去重即可，防止同一用户的多条记录被误删。'},
{q:'为什么去重和替换之前一定要先复制一份原始数据？',a:'这两个操作不可逆，尤其发奖励场景删错了是真金白银的损失。"动刀前先备份"是数据分析的第一条职业习惯。'}
],
5:[
{q:'数据验证和条件格式都跟"数据质量"有关，区别是什么？',a:'数据验证是"预防"——在数据进来之前限制输入，不让错数据出现；条件格式是"体检"——数据已经存在，标出来让你看。一个管入口，一个管事后。'},
{q:'你给靓号定价表设的条件格式：为什么>180标红、<50标绿？',a:'>180是展示款（高价、不主动推），标红提醒注意；<50是引流款（低价吸引点击），标绿区分。颜色是为了让异常价格一眼可见，不用逐行看数字。'}
],
6:[
{q:'透视表四个区域，一句话分别是什么？',a:'行/列=按什么分类；值=汇总计算什么（计数/求和/平均）；筛选器=整体按什么条件过滤。这四个区域就是透视表的全部逻辑。'},
{q:'透视表默认对数字字段和文本字段分别做什么汇总？想要"平均值"怎么办？',a:'数字默认求和、文本默认计数。要平均值：点值字段→值字段设置→汇总方式选"平均值"。'}
],
7:[
{q:'什么时候需要日期分组？它能解决什么问题？',a:'行标签是日期时，每天一行几百行没法看。右键日期→组合→按月/季度/年归并，几百行变成十几行，趋势一目了然。'},
{q:'切片器比筛选下拉框好在哪？（至少说出2点）',a:'①一眼能看出当前筛的是什么；②可以同时联动多个透视表和图表一起切换；③给老板展示时点按钮比翻下拉菜单直观专业。'}
],
8:[
{q:'计算字段是干什么的？',a:'在透视表里用已有字段算出一个新指标。比如"转化率=购买人数/参与人数"，不用回到原始数据里加列。'},
{q:'你做的"转化率"计算字段如果显示 #DIV/0!，说明什么？',a:'分母为零——有些活动的参与人数是0，除以零就会报这个错。分析时看到它要先检查数据有没有空值或零值。'}
],
9:[
{q:'COUNT和COUNTA混用会有什么后果？',a:'COUNT只数数字，COUNTA数所有非空。给"用户名"这种文本列用COUNT会得到0，人数统计就全错了。统计前先想清楚你的列是什么类型。'},
{q:'用AVERAGEIF算一下：本练习数据里哪个分类的平均客单价最高？',a:'答案以练习文件为准（每份文件数据不同）。方法：=AVERAGEIF(分类列,某分类,金额列)，每个分类算一遍再比较。'}
],
10:[
{q:'VLOOKUP第四参数写TRUE和FALSE各适合什么场景？',a:'FALSE=精确匹配，找ID必须用它（找不到返回#N/A）；TRUE=近似匹配，"找最接近且不超过"，适合金额→折扣档位，但要求查找列升序排列。'},
{q:'两张表都有"用户ID"，VLOOKUP却返回#N/A，最可能的原因？',a:'格式不一致——一边是文本一边是数字（看对齐方式能分辨），或者有多余空格。先统一两边格式再匹配。'}
],
11:[
{q:'嵌套IF和IFS哪个更推荐？为什么？',a:'IFS（Excel 2016+/WPS新版都有）。条件多的时候嵌套IF要一层层数括号，IFS平铺直叙，别人一眼能看懂你的判断逻辑。'},
{q:'=TEXT(123,"000")的结果是数字123吗？',a:'不是，是文本"123"。TEXT返回的是文本，不能参与计算。需要计算时用原值，TEXT只用于显示。'}
],
12:[
{q:'折线图和柱状图各适合什么场景？',a:'折线图=展示随时间的变化趋势；柱状图=分类之间比大小。把分类数据画成折线图会暗示"连续性"，误导读者。'},
{q:'饼图的分类超过几个就不该用了？为什么？',a:'5个。分类太多饼图碎成一片，读者分不清谁大谁小，这时改用柱状图。'}
],
13:[
{q:'组合图什么时候用？设置时最容易漏的一步是什么？',a:'两个指标量级差太大但想看关联趋势时用，比如销量(柱状)+均价(折线)。最容易漏：给折线勾"次坐标轴"，否则折线会被压扁在图表底部。'},
{q:'迷你图是什么？适合用在哪？',a:'塞进一个单元格里的微型图表。适合给数据表的每一行加一条趋势线，扫一眼就能看出每行的走势，不用做几十张图。'}
],
14:[
{q:'30分钟全流程的顺序是什么？为什么顺序不能乱？',a:'清洗→透视汇总→函数算指标→图表展示→写结论。清洗必须在最前——脏数据做的分析结论全是错的，后面越漂亮错得越离谱。'},
{q:'你跑全流程时哪个环节最慢？',a:'无标准答案。如实记录自己的用时，最慢的环节就是接下来要专项强化的地方。'}
],
15:[
{q:'你的"我现在能用Excel做什么"清单列了多少件？',a:'无标准答案。建议至少覆盖：清洗（去重/分列）、筛选排序、透视表、常用函数、图表、条件格式、数据验证——这7类就是数据分析日常的80%。'}
],
16:[
{q:'Excel阶段（Day 1-15）你最没把握的是哪块？',a:'无标准答案。把没把握的列出来，今天弹性日就补它——比按顺序重学一遍效率高得多。'}
],
17:[
{q:'昨天补的薄弱环节，今天还会了吗？',a:'无标准答案。检验标准：不看教程能独立完成一遍。会了就换下一个薄弱点，不会就再来一次。'}
],
18:[
{q:'Excel阶段收官：如果只让你带走3个技能去工作，你选哪3个？',a:'无标准答案，但建议包含：数据透视表（汇总任何数据）、VLOOKUP（跨表匹配）、数据清洗（去重+分列）。这三个能解决工作里最常见的问题。'}
],
19:[
{q:'SQL是编程语言吗？',a:'不是。SQL是查询语言——你只描述"要什么"，不用写循环和逻辑。它跟你在搜索框输入关键词没有本质区别，别被"语言"两个字吓到。'},
{q:'SELECT/FROM/WHERE各自管什么？',a:'SELECT=要什么列；FROM=从哪张表取；WHERE=满足什么条件的行。这是SQL最基础的查询骨架。'}
],
20:[
{q:'AND和OR的区别？多个条件混用时怎么办？',a:'AND=两个条件同时满足；OR=满足任意一个。混用时加括号明确优先级，比如 WHERE (a=1 OR b=2) AND c=3。'},
{q:'LIKE里的%和_分别匹配什么？',a:'%匹配任意多个字符（含0个），_恰好匹配一个字符。A%=以A开头，%A=以A结尾，%A%=包含A。'}
],
21:[
{q:'ORDER BY多列是怎么排的？',a:'先按第一列排，第一列相同的行再按第二列排。所以 ORDER BY continent, population DESC = 先按大洲字母序，同大洲内按人口降序。'},
{q:'LIMIT最常用的3个场景？',a:'①看数据长什么样（LIMIT 10）；②找极值（ORDER BY 列 DESC LIMIT 1）；③分页（LIMIT 20 OFFSET 40）。'}
],
22:[
{q:'所有聚合函数都会自动忽略什么值？',a:'NULL（空值）。所以AVG是"非空行的平均"而不是"所有行的平均"，COUNT(列名)也不统计NULL行，COUNT(*)才统计所有行。'},
{q:'COUNT(*)和COUNT(列名)的区别？',a:'COUNT(*)数所有行；COUNT(列名)只数该列非空的行。统计"有多少条记录"用COUNT(*)。'}
],
23:[
{q:'WHERE和HAVING的区别？为什么"WHERE COUNT(*)>10"会报错？',a:'WHERE在分组前筛选原始行，HAVING在分组后筛选组。COUNT(*)是分组后才算出来的，WHERE执行时它还不存在，所以分组后的条件只能放HAVING里。'},
{q:'把SQL执行顺序背一遍。',a:'FROM→WHERE→GROUP BY→HAVING→SELECT→ORDER BY→LIMIT。记忆口诀：FWGH SOL。面试高频考点。'}
],
24:[
{q:'今天刷题错得最多的是哪类题？',a:'无标准答案。把错题记进错题本并写下原因——是概念不清还是粗心，两周后重做一遍检验。'}
],
25:[
{q:'本周SQL概念哪个最模糊？',a:'无标准答案。翻回对应天的教程重看一遍，再用SQLZoo对应章节的题验证自己真懂了。'}
],
26:[
{q:'LEFT JOIN为什么是工作中最常用的JOIN？',a:'它保留左表（主表）的所有行，右表匹配不上就填NULL。比如"所有用户，买没买过都保留"——INNER JOIN会直接把没买过的人丢掉。'},
{q:'ON是干什么的？',a:'告诉数据库"用哪个列把两张表配对"。ON a.user_id=b.user_id 就是把两表的user_id对上。'}
],
27:[
{q:'三张表怎么JOIN？',a:'串行连接：FROM A JOIN B ON A.id=B.id JOIN C ON B.id=C.id。每JOIN一张表就跟一个ON条件，别漏。'},
{q:'什么是自连接？经典应用场景？',a:'同一张表用两个不同别名连自己。经典场景：员工表里有"上级ID"，查"每个员工+他的上级名字"——上级也是员工，在同一张表里。'}
],
28:[
{q:'写出"各等级用户的平均购买金额"的SQL（用户表:用户ID/昵称/等级，购买表:用户ID/金额/日期）。',a:'SELECT u.level, AVG(o.amount) FROM 用户表 u JOIN 购买表 o ON u.ID=o.用户ID GROUP BY u.level。这是JOIN+GROUP BY的经典组合，工作中最常见的查询模式。'}
],
29:[
{q:'子查询能放在SQL的哪些位置？',a:'WHERE里（IN (SELECT...)）、FROM里（当临时表用）、SELECT里（每行附一个值）。WHERE子查询最常见，FROM子查询常用于先聚合再筛选。'},
{q:'子查询和JOIN怎么选？',a:'数据量小、逻辑嵌套浅用子查询（好读）；数据量大、多层关联用JOIN（数据库对JOIN优化更成熟，更快）。'}
],
30:[
{q:'ROW_NUMBER() OVER (PARTITION BY 列 ORDER BY 列) 在做什么？',a:'按PARTITION BY分组，组内按ORDER BY排序，从1开始编号。常用于"每组取前N条"，比如每个分类里价格最高的3个靓号。'},
{q:'窗口函数和GROUP BY最大的区别？',a:'GROUP BY把组内行合并成一行，原始明细丢失；窗口函数保留所有原始行，只在每行旁边加一列计算结果。'}
],
31:[
{q:'LAG和LEAD必须搭配什么？为什么？',a:'必须在OVER里写ORDER BY——不定义排序，"上一行"和"下一行"就没有意义。'},
{q:'环比增长怎么用LAG算？',a:'环比=(今天-昨天)/昨天。先用 LAG(sales,1) OVER (ORDER BY date) 取昨天的值，再用(今天-昨天)/昨天算出比率。'}
],
32:[
{q:'刷题时每道题限时5分钟的意义是什么？',a:'模拟面试的真实压力。超时的题目即使最后做出来了，也说明熟练度不够，要进错题本重点练。'}
],
33:[
{q:'中等难度的题和简单题最大的区别在哪？',a:'通常多一层嵌套——子查询、JOIN、窗口函数组合在一起。应对方法：把大问题拆成小步骤，先写内层验证结果，再写外层。'}
],

],

36:[
{q:'SQL阶段（Day 19-35）最值得带走的3个技能？',a:'无标准答案，建议：WHERE条件筛选、GROUP BY分组汇总、LEFT JOIN连接表。这三个覆盖了工作查询的绝大多数场景。'}
],
37:[
{q:'一个"好的指令"长什么样？',a:'三要素：数据是什么（列名/行数/格式）+要什么结果（具体指标/图表/格式）+特殊要求。对比一下"帮我分析数据"和Day 37任务里的详细描述，差距就是成功率。'},
{q:'同样的分析需求，描述详细和描述笼统差在哪？',a:'详细描述让AI不用猜，一次成功率高；笼统描述AI会补全它自己假设的信息，结果可能和你要的完全不一样。'}
],
38:[
{q:'装Python时最容易漏掉的一步是什么？漏了会怎样？',a:'勾选"Add Python to PATH"。漏了之后命令行输入python会提示找不到——需要重新安装或手动配置环境变量。'},
{q:'import pandas不报错说明什么？',a:'说明pandas库已经正确安装，可以开始跑AI生成的代码了。'}
],
39:[
{q:'让AI洗数据之前，要告诉它哪几件事？',a:'列名、大概行数、哪些列有空值、日期等列的格式问题。信息越具体，AI写的清洗代码越准。'},
{q:'AI写完清洗代码，你跑完就完事了吗？',a:'没有。必须检查结果——行数对不对、空值处理得对不对、有没有误删。AI给的是"初稿"，验证结果是你不可替代的工作。'}
],
40:[
{q:'让AI画图要描述清楚哪几件事？',a:'图类型（柱状/折线/散点）、用哪些列、颜色、标题、输出格式（PNG）。跟点菜一样，说清楚才有想要的图。'},
{q:'想改图的颜色或字体，需要自己去学matplotlib语法吗？',a:'不需要。直接告诉AI"颜色改成XX""字体调大"，让它改代码。你的工作是描述和验收，不是背代码。'}
],
41:[
{q:'describe()报告能告诉你什么？',a:'每列的计数、均值、标准差、最小值、25%/50%/75%分位数、最大值、缺失值比例——一份数据体检报告。'},
{q:'让AI找异常值时，规则为什么要明确？',a:'"异常"必须可定义，比如"超过均值±3倍标准差"。规则模糊AI就乱猜，规则明确结果才可复核。'}
],
42:[

{q:'你的"活动复盘报告模板"至少应该包含什么？',a:'参与人数、购买转化、关键图表、结论与建议。以后每次活动结束只换数据文件，就能自动出一份标准报告。'}

50:[
{q:'箱线图能告诉你什么？',a:'价格的中位数、上下四分位分布范围、异常值（箱体外的点）。比平均值更能看清价格的真实分布。'},
{q:'黄金销售区间50-180怎么验证是否成立？',a:'统计这个价格区间内的销量占比和售出速度。占比高、动销快=定价策略是数据驱动的；反之就要调整。'}

{title:'日期分组',body:'如果行标签是日期，透视表默认每一天一行——几百行没法看。\n**解决方法**：右键任意日期 → 选择"组合" → 弹出窗口 → 勾选"月"（或"季度""年"）→ 确定。\n现在几百行日期变成了 12 行（1月-12月）。这就是"日期分组"。\n**也可以多选**：同时勾选"月"和"年"→ 每年下面再分月。\n**实战**：用销售明细的"日期"列，按月分组，看每个月的销售总金额趋势。'},
{title:'数值分组',body:'跟日期分组同一个逻辑，但用于数字列。\n右键行标签中的金额 → 组合 → 设置"起始于 0，终止于 3000，步长 200"→ 金额被分成 0-200、200-400、400-600… 多个区间。\n**配合计数**：每个金额区间有多少笔订单 → 这就是你的订单金额分布。\n（靓号价格的区间分布练习放到阶段四项目一里做，那里用真实靓号数据。）'},
{title:'切片器',body:'插入 → **切片器** → 勾选"分类"→ 出现一个浮动面板，上面有电子产品/服装鞋帽/食品饮料/家居用品/运动户外五个按钮。\n**怎么用**：点"电子产品"→ 透视表立刻只显示电子产品的数据。点"服装鞋帽"→ 切换到服装数据。再点一下同一个按钮→取消筛选。\n**比筛选下拉框好在哪**：\n1. 一眼能看出当前筛了什么\n2. 可以同时连多个透视表——点一下切片器，所有透视表和图表一起切换\n3. 给老板展示时，点按钮比翻下拉菜单专业得多\n**WPS用户注意**：WPS的切片器入口不同——先**点击选中透视表**，顶部出现"数据透视表工具"后，在**分析**选项卡里点**插入切片器**（WPS 2019以上版本才有）。'}
],
9:[
{title:'统计函数全家桶',body:'这几个函数是你日常 80% 分析的基础：\n**=SUM(范围)**：求和。=SUM(B2:B100) → B2到B100加总。\n**=AVERAGE(范围)**：平均值。自动忽略空单元格和文本。\n**=COUNT(范围)**：数有几个数字。只统计数据是数字的格子——文本、空值、错误值都不算。\n**=COUNTA(范围)**：数有几个非空单元格。包含文本、数字、日期——只要格子里有东西就算。\n**区别**：COUNT 只数"钱""人数"这种数字列，COUNTA 数"名字""活动类型"这种文本列。用混了计数就对不上。\n**=MAX(范围)/MIN(范围)**：最大值/最小值。找"最贵的号多少钱"或"最少几个人参加"。'},
{title:'COUNTIF 条件计数',body:'=COUNTIF(范围, 条件)\n计数器加上了条件。**条件怎么写**：\n- 精确匹配：=COUNTIF(A:A,"竞拍") → A列中等于"竞拍"的个数\n- 大于：=COUNTIF(B:B,">100") → B列中大于100的个数\n- 包含：=COUNTIF(A:A,"*888*") → A列中包含"888"的(**号是通配符)\n- 不等于：=COUNTIF(A:A,"<>竞拍") → A列中不是"竞拍"的\n**多条件版**：=COUNTIFS(范围1,条件1, 范围2,条件2, ...) → 所有条件同时满足才计数。\n**实战**：统计"价格>100的5位靓号数量" =COUNTIFS(位数列,5, 价格列,">100")'},
{title:'SUMIF 条件求和',body:'=SUMIF(条件范围, 条件, 求和范围)\n**跟 COUNTIF 的区别**：COUNTIF 数个数，SUMIF 求和。\n**实战**：=SUMIF(规律列,"*888*", 价格列) → 所有含888的靓号卖了多少钱。\n**多条件版**：=SUMIFS(求和范围, 条件范围1,条件1, 条件范围2,条件2)\n注意 SUMIFS 的第一个参数是求和范围（跟 SUMIF 顺序不同！）。'}
],
10:[
{title:'VLOOKUP 精确匹配',body:'=VLOOKUP(要找谁, 在哪个区域找, 返回第几列, FALSE)\n**举例**：有两个表——用户表(ID/昵称/等级)，参与表(用户ID)——你想把参与表里的用户ID匹配出昵称。\n在参与表的空白列输入：=VLOOKUP(A2, 用户表!A:C, 2, FALSE)\n翻译：在用户表的A到C列里，找等于A2(某个用户ID)的行，找到后返回那行第2列(昵称)。FALSE=必须精确匹配。\n**常见坑**：\n- 查找列必须在第一列（VLOOKUP 只能向右看，不能向左看）\n- 找不到返回 #N/A（检查是不是有空格或格式不一致）\n- 第四参数写 TRUE 会模糊匹配（数据必须升序排列），新手别用'},
{title:'VLOOKUP 近似匹配',body:'=VLOOKUP(查找值, 区域, 返回列, TRUE)\n**适用场景**：区间匹配。比如你想根据金额匹配折扣档位：\n- 0→无折扣, 50→9折, 100→8折, 180→7折\n- 买了一个 88 元的号 → VLOOKUP 模糊匹配到 50 那一档 → 9折\n**要求**：查找列必须**从小到大排序**，否则结果不可预测。\n模糊匹配的逻辑："找最接近且不超过"——找 88 时，0 不超过、50 不超过、100 超过了 → 停在 50。'},
{title:'XLOOKUP 简介',body:'=XLOOKUP(找什么, 查找列, 返回列)\n**比 VLOOKUP 好在哪**：\n1. 不用数第几列——直接指定返回哪列，不会因为中间加了一列导致参数错误\n2. 可以向左查——查找列和返回列不用"查找列在左"\n3. 找不到时可以返回自定义文字而不是 #N/A\n**前提**：Excel 2021 / Microsoft 365 才有；**WPS 2021 及以上版本也有**。老版本 Excel 没有这个函数。\n如果你们公司用老版本 Excel，先记住有这个函数，以后升级了再用。面试时提一句"我知道 XLOOKUP 比 VLOOKUP 好用"是加分项。'}
],
11:[
{title:'IF 条件判断',body:'=IF(条件, 成立时返回什么, 不成立时返回什么)\n**基础**：=IF(A1>100, "贵", "便宜") → A1>100时显示"贵",否则显示"便宜"\n**嵌套 IF**：=IF(A1>180, "展示款", IF(A1>100, "利润款", IF(A1>50, "主力款", "引流款")))\n**多重条件用 IFS（Excel 2016+）**：=IFS(A1>180,"展示款", A1>100,"利润款", A1>50,"主力款", TRUE,"引流款")。比嵌套 IF 清晰得多。\n**实战**：给靓号定分类——>180=展示款(不主动推), 100-180=利润款(溢价空间大), 50-100=主力款(走量), <50=引流款(吸引点击)。'},
{title:'LEFT/RIGHT/MID 截取文本',body:'**=LEFT(文本, 几位)**：从左边截取。=LEFT("48360054",4) → "4836"\n**=RIGHT(文本, 几位)**：从右边截取。=RIGHT("48360054",3) → "054"\n**=MID(文本, 从第几位开始, 取几位)**：任意位置。=MID("48360054",3,2) → 从第3位取2位 → "36"\n**实战**：靓号"48360054"，=RIGHT(A1,1) 取最后一位 → 判断尾号是 8 还是 4（决定了"吉祥度"）。=MID(A1,4,3) 从第4位取3位→判断是否含特定组合。'},
{title:'TEXT 格式化',body:'=TEXT(数值或日期, "格式代码")\n**常用格式代码**：\n- =TEXT(A1, "yyyy年mm月dd日") → 2026年08月06日\n- =TEXT(A1, "aaaa") → 星期四（自动显示中文星期几；中文版WPS同样用aaaa，英文版Excel/WPS用dddd）\n- =TEXT(B1, "#,##0") → 1,234,567（加千分位分隔符）\n- =TEXT(B1, "0.00") → 1234.00（固定两位小数）\n**TEXT 返回的是文本**，不能参与计算。=TEXT(123,"000")="123"(文本), 不是 123(数字)。'}
],
12:[
{title:'柱状图',body:'**适用场景**：比较不同类别的数值大小。\n**制作**：选中数据 → 插入 → 柱状图 → 选择样式。\n**实战**：选中"分类统计"工作表的"分类"列和"销售额"列 → 插入柱状图 → 得到"各分类销售额对比"。\n**美化**：点击图表 → 右上角 + → 勾选"数据标签"(柱子上显示数字)、"轴标题"(标一下 X 轴和 Y 轴)。\n**注意事项**：柱状图必须从 0 开始（Y 轴最小值=0）。如果从中间值开始会放大差异，看起来像是在误导。'},
{title:'折线图',body:'**适用场景**：展示随时间变化的趋势。\n**制作**：选中日期列+数值列 → 插入 → 折线图。\n**实战**：选中"月度统计"工作表的"月份"列和"销售额"列 → 折线图 → 一眼看出"哪个月卖得最好、趋势是涨还是跌"。\n**不要用折线图**：对比分类数据（比如 5 个分类对比）——折线图暗示"连续性"，分类数据没有连续性，用柱状图。'}
],
19:[
{title:'什么是数据库和SQL',body:'**数据库** = 一个电子表格文件，但更大、更规范。里面有多张**表**，每张表有**行**和**列**。\n**SQL** = Structured Query Language（结构化查询语言）。就是你用来"跟数据库说话"的语言。你跟数据库说什么，它就返回什么。\n**类比理解**：数据库=图书馆，表=书架，行=一本书，列=书的属性(书名/作者/年份)。SQL=你跟图书管理员说的话："帮我找2020年后出版的所有科幻小说"→ 管理员(SQL引擎)去找→返回结果。\n**不要被"语言"吓到**。SQL 不是编程语言，是**查询语言**。你不需要写循环、不需要写逻辑，只需要描述"我要什么"。跟搜索框输入关键词没有本质区别。'},
{title:'打开SQLZoo，写出第一句SQL',body:'**现在打开**：https://sqlzoo.net/wiki/SQL_Tutorial\n**做第 0 节**（00 SELECT basics）：\n右边看到例题 → 在输入框写 SQL → 点 Submit → 看结果。\n**第一句 SQL**：`SELECT population FROM world WHERE name = \'Germany\'`\n翻译成人话：从 world 这张表里，找出 name 等于 Germany 那行，返回它的 population。\n**SQL 的结构**：\n- SELECT：你要什么列\n- FROM：从哪张表\n- WHERE：什么条件\n- 分号结尾（SQLZoo 里可省略）\n**现在做**：把第 0 节所有题目做完（大概 5 道题，10 分钟）。做错了没关系，看报错信息——SQL 的报错通常会告诉你哪个位置写错了。'},
{title:'关键认知：SQL 不区分大小写',body:'SELECT 和 select 是一样的。但行业约定：\n- **关键字大写**：SELECT、FROM、WHERE、AND、OR\n- **表名列名小写**：world、name、population\n这样一眼就能分辨"这是 SQL 命令"还是"这是你的数据"。\n**为什么 SQLZoo 用英文**：SQL 关键字就是英文，数据库里的表名和列名也通常是英文。习惯英文界面是必要的——以后工作中你面对的都是英文表名。'}
],
20:[
{title:'WHERE 的各种条件',body:'WHERE = 筛选。跟 Excel 的"筛选"一样。\n**基础比较**：\n- `=` 等于：WHERE name = \'China\'\n- `>` 大于：WHERE population > 100000000（1亿）\n- `<` 小于：WHERE area < 50000\n- `>=` `<=`：大于等于、小于等于\n- `<>` 或 `!=`：不等于\n**多个条件**：\n- AND：两个条件都要满足。WHERE population > 1e8 AND area > 1e6\n- OR：至少满足一个。WHERE continent = \'Europe\' OR continent = \'Asia\'\n- 混合时加括号：WHERE (a=1 OR b=2) AND c=3\n**IN**：= OR 的简写。WHERE continent IN (\'Europe\',\'Asia\') = WHERE continent=\'Europe\' OR continent=\'Asia\'\n**BETWEEN**：在范围内(含边界)。WHERE population BETWEEN 1e7 AND 1e8 = population>=10000000 AND population<=100000000'},
{title:'LIKE 模糊匹配',body:'LIKE = 文本模糊查找。配合通配符：\n- `%`：匹配任意多个字符(含 0 个)\n- `_`：匹配恰好一个字符\n**练习**：\n- WHERE name LIKE \'A%\' → 以 A 开头的国家（Albania, Argentina...）\n- WHERE name LIKE \'%stan\' → 以 stan 结尾的国家（Pakistan, Afghanistan...）\n- WHERE name LIKE \'%a%\' → 名字里包含字母 a 的国家\n- WHERE name LIKE \'C___\' → C 开头、恰好 4 个字母（Chad, Cuba...）\n- WHERE name LIKE \'% %\' → 名字里含有空格（United States, New Zealand...）\n**注意**：LIKE 默认不区分大小写（取决于数据库）。模糊匹配比精确匹配慢，数据量大时少用。'}
],
21:[
{title:'ORDER BY 排序',body:'ORDER BY 列名 DESC/ASC\n- ASC = 升序（从小到大/A-Z），默认值可以省略\n- DESC = 降序（从大到小/Z-A）\n**多列排序**：ORDER BY continent ASC, population DESC → 先按大洲字母序排，同大洲内按人口从大到小排。\n**练习**：SELECT name, population FROM world ORDER BY population DESC → 人口最多的国家排第一个（中国或印度）。加 LIMIT 5 → 只看前 5。'},
{title:'LIMIT 限制行数',body:'LIMIT N = 只看前 N 行。\n**常见用法**：\n- 看数据长什么样：LIMIT 10 → 只取前 10 行，不用拉全表\n- 找最大/最小：ORDER BY population DESC LIMIT 1 → 人口最多的那一个国家\n- 分页：LIMIT 20 OFFSET 40 → 跳过前 40 条，取 20 条（第 3 页，每页 20 条）\n**OFFSET** = 跳过多少行。LIMIT 10 OFFSET 5 = 跳过前 5 行，取 10 行。'},
{title:'DISTINCT 去重',body:'SELECT DISTINCT 列名 FROM 表名 → 返回去重后的值。\n**练习**：SELECT DISTINCT continent FROM world → 返回 7 个大洲（每个大洲只出现一次）。\n**COUNT + DISTINCT**：SELECT COUNT(DISTINCT continent) FROM world → 7（有多少个不重复的大洲）。\n**注意**：DISTINCT 对后面的所有列生效。SELECT DISTINCT a,b = 两个列的组合去重，不是只对 a 去重。'}
],
22:[
{title:'聚合函数',body:'聚合函数 = 把多行合并成一个数字。\n**COUNT(*)**：数有多少行。SELECT COUNT(*) FROM world → 全世界有多少国家。\n**SUM(列)**：求和。SELECT SUM(population) FROM world → 全世界总人口。\n**AVG(列)**：平均值。SELECT AVG(population) FROM world → 平均每个国家的人口。\n**MAX(列)/MIN(列)**：最大/最小。SELECT MAX(population) FROM world → 人口最多的国家的人口数。\n**关键规则**：聚合函数自动忽略 NULL 值。AVG = SUM / 非空行数，不是 / 总行数。\n**练习**：打开 SQLZoo 第 5 节（05 SUM and COUNT），做里面关于 COUNT 和 SUM 的题目。'},
{title:'聚合与WHERE的组合',body:'聚合函数可以和 WHERE 一起用。\nSELECT COUNT(*) FROM world WHERE continent = \'Europe\' → 欧洲有多少个国家。\nSELECT SUM(population) FROM world WHERE continent = \'Asia\' → 亚洲总人口。\n**执行顺序**：先 WHERE 筛选 → 再聚合计算。所以 WHERE 里不能用聚合函数（"WHERE COUNT(*)>10"会报错——聚合结果还没算出来）。'}
],
23:[
{title:'GROUP BY 是什么',body:'GROUP BY = 按分类汇总。Excel 透视表的 SQL 版本。\n**举例**：SELECT continent, COUNT(*) FROM world GROUP BY continent\n翻译：按大洲分组 → 每个大洲一行 → 数每个大洲有多少国家。\n**规则**：SELECT 后面，不带聚合函数的列，必须出现在 GROUP BY 后面。\n所以 SELECT name, COUNT(*) FROM world GROUP BY continent 是错误的——name 不属于 continent 分组的一部分。\n**多列分组**：GROUP BY continent, region → 大洲+区域，每个组合一行。'},
{title:'HAVING 分组后筛选',body:'HAVING = 分组后的 WHERE。\n**区别**：WHERE 筛原始行 → GROUP BY 分组 → HAVING 筛分组结果。\n**举例**：SELECT continent, COUNT(*) FROM world GROUP BY continent HAVING COUNT(*)>10 → 只要国家数超过 10 的大洲。\n**为什么不能写成 WHERE COUNT(*)>10**：因为 COUNT(*) 是分组后才算出来的，WHERE 在分组前执行，那时还没有 COUNT 结果。只能放在 HAVING 里。\n**执行顺序**：FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT\n背下来。面试必考。'}
],
26:[
{title:'JOIN 是什么',body:'JOIN = 把两张表按某个共同字段拼在一起。\n**类比**：你有两张 Excel 表——用户表（ID/昵称）和购买表（用户ID/金额）。你想在购买表里加上"昵称"列。\n手工方法：VLOOKUP。\nSQL 方法：JOIN。\n**INNER JOIN**：SELECT * FROM 用户表 INNER JOIN 购买表 ON 用户表.ID = 购买表.用户ID → 只返回"两表都有的"行。没买过的用户被丢弃，找不到用户的购买记录也被丢弃。\n**LEFT JOIN**：SELECT * FROM 用户表 LEFT JOIN 购买表 ON ... → 保留左表所有行，右表没有匹配的就填 NULL。更常用。"所有用户，买没买过都保留"。'},
{title:'ON 条件',body:'ON = 告诉数据库"用哪个列来匹配两表"。\nON a.user_id = b.user_id → a 表的 user_id 和 b 表的 user_id 配对。\n**可以多个条件**：ON a.id=b.id AND a.date=b.date\n**ON vs WHERE**：对于 INNER JOIN，ON 和 WHERE 效果一样。对于 LEFT JOIN，ON 在连接时筛选，WHERE 在连接后筛选——结果完全不同。\n**动手**：打开 SQLZoo 第 6 节（06 JOIN），用 game 和 goal 表练习。'},
{title:'LEFT JOIN 为什么最常用',body:'**场景**：用户表 LEFT JOIN 购买表。\n- 买了东西的用户 → 昵称 + 购买金额\n- 没买过的用户 → 昵称 + NULL\n结果完整保留所有用户。\n如果用的是 INNER JOIN，没买过的用户直接消失了，你就不知道"有多少用户从来不下单"。\n**规则**：主表（你想保留完整的表）放左边，辅助信息表放右边。工作中 90% 用 LEFT JOIN。'}
],
27:[
{title:'多表连接',body:'三张表怎么连？串行 JOIN。\nSELECT * FROM A LEFT JOIN B ON A.id=B.id LEFT JOIN C ON B.id=C.id\n**顺序**：从左到右，每次 JOIN 产生一张临时"宽表"作为下一次 JOIN 的左表。\n**别名简化**：FROM world w JOIN city c ON w.id=c.country_id → w 和 c 是别名，后面全部用缩写，不用写全表名。\n**练习**：用 SQLZoo 的涉及多张表的题目练手。遇到报错先检查：每个 JOIN 都跟了自己的 ON 吗？'},
{title:'自连接(Self Join)',body:'一张表自己连自己。\n**场景**：员工表里有一个"上级ID"列——上级也是员工，在同一个表里。\nSELECT e.name AS 员工, m.name AS 上级 FROM emp e LEFT JOIN emp m ON e.manager_id = m.id\n**关键**：同一张表用不同别名(e 和 m)，当作两张表来处理。\n**面试经典题**："查出每个员工和他的上级的名字"。答案就是自连接。'}
],
29:[
{title:'子查询是什么',body:'子查询 = 一个查询里面嵌套另一个查询。内层查询的结果给外层查询用。\n**类比**：你先查"中国有多少人口"→ 把这个数字记下来 → 再查"谁比这个数字大"。子查询就是把这两步合成一步。\n**放在 WHERE 中**：SELECT name FROM world WHERE population > (SELECT population FROM world WHERE name=\'Russia\') → 人口超过俄罗斯的国家。\n**放在 FROM 中**：把子查询结果当一张临时表用。SELECT * FROM (SELECT continent, COUNT(*) AS n FROM world GROUP BY continent) AS tmp WHERE n > 10。\n**放在 SELECT 中**：SELECT name, (SELECT AVG(population) FROM world) AS 全球平均 FROM world → 每行旁边附加一个"全球平均人口"列。'},

// ==================== 状态管理 ====================
const STORAGE_KEY = 'data_learning_tracker_state';

function defaultState(){
  return {
    currentDay:1,           // 当前学习日 1-60
    completedDays:{},       // {dayNum:true}
    rolloverTasks:[],       // [{text,res,resUrl,time,fromDay}]
    rolloverSources:{},     // {fromDay: {done:N, total:M}} — 记录滚存来源天已完成了几个任务
    todayCheckedIn:false,
    todayCompleted:false,  // 点了"今天就到这"后为true
    todayTaskStatus:{},     // {"dayNum-taskIdx":"done"|"undone"}
    streak:0,
    lastActiveDate:null,    // 'YYYY-MM-DD'
    totalDone:0,
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const s = JSON.parse(raw);
      // 合并默认值,处理版本升级
      const def = defaultState();
      for(const k of Object.keys(def)){
        if(!(k in s)) s[k]=def[k];
      }
      // 自动修复：滚存来源天的任务已全部补完但未被标记完成
      if(s.rolloverSources){
        Object.keys(s.rolloverSources).forEach(fromDay => {
          const src = s.rolloverSources[fromDay];
          // 该天没有任何滚存任务残留
          const remaining = (s.rolloverTasks||[]).filter(r => r.fromDay == fromDay).length;
          if(remaining === 0){
            // 只有当来源天原本的任务就全部做完,才算完成;
            // 任务丢失(如旧版bug清空)不能算完成,只清理账本
            if(!s.completedDays[fromDay] && src && src.done >= src.total){
              s.completedDays[fromDay] = true;
            }
            delete s.rolloverSources[fromDay];
          }
        });
      }
      // 修复旧版遗留的"幽灵滚存": 滚存任务没有来源天账本的情况
      if(s.rolloverTasks && s.rolloverTasks.length>0){
        const countsByDay = {};
        s.rolloverTasks.forEach(r=>{ countsByDay[r.fromDay] = (countsByDay[r.fromDay]||0)+1; });
        Object.keys(countsByDay).forEach(fromDay => {
          if(s.completedDays && s.completedDays[fromDay]){
            // 来源天已经完成: 残留的滚存任务是冗余数据,直接清掉
            s.rolloverTasks = s.rolloverTasks.filter(r => r.fromDay != fromDay);
            if(s.rolloverSources) delete s.rolloverSources[fromDay];
          } else if(s.rolloverSources && !s.rolloverSources[fromDay]){
            // 来源天未完成但没有账本: 补账本,补做后能正常标记该天完成
            s.rolloverSources[fromDay] = {done: 0, total: countsByDay[fromDay]};
          }
        });
      }
      return s;
    }
  }catch(e){}
  return defaultState();
}

function saveState(state){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// ==================== 工具函数 ====================
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function dayOfWeek(){
  return new Date().getDay(); // 0=Sun, 6=Sat
}

function isWeekend(){
  const d = dayOfWeek();
  return d===0 || d===6;
}

function getDayData(dayNum){
  return CURRICULUM.find(d=>d.day===dayNum) || null;
}

function getPhaseName(phase){
  const names={1:'阶段一:Excel进阶',2:'阶段二:SQL基础',3:'阶段三:AI辅助分析',4:'阶段四:项目实战'};
  return names[phase]||'';
}

function getPhaseColor(phase){
  const colors={1:'phase1',2:'phase2',3:'phase3',4:'phase4'};
  return colors[phase]||'phase1';
}

function getDayEstimate(){
  const d = getDayData(state.currentDay);
  if(!d) return 60;
  let mins = 0;
  d.tasks.forEach(t=>{
    if(t.time){
      const m = parseInt(t.time);
      if(!isNaN(m)) mins+=m;
    }
  });
  return mins||60;
}

function getDaysInPhase(phase){
  return CURRICULUM.filter(d=>d.phase===phase).length;
}

function getCompletedDaysInPhase(phase, completedDays){
  return CURRICULUM.filter(d=>d.phase===phase && completedDays[d.day]).length;
}

// ==================== 渲染 ====================
let state = loadState();
let reviewMode = null; // null=正常模式, number=正在复习第X天
let pendingRollover = null; // 待确认的rollover数据

function showRolloverConfirm(undoneCount, dayData){
  pendingRollover = dayData;
  const prevCount = state.rolloverTasks.length;
  const totalCount = undoneCount + prevCount;
  const modal = document.getElementById('checkoutModal');
  const msg = document.getElementById('modalMsg');
  const btns = document.querySelector('#checkoutModal .modal-btns');
  let detail = '';
  if(prevCount>0){
    detail = `<br><span style="color:var(--sub);font-size:.82rem">今日 ${undoneCount} 个 + 此前积压 ${prevCount} 个 = 共 ${totalCount} 个</span>`;
  }
  msg.innerHTML = `📌 <strong>${totalCount}</strong> 个未完成任务将滚入<br><strong>明天（Day ${state.currentDay+1}）</strong>的学习列表顶部。${detail}<br><br><span style="color:var(--sub);font-size:.8rem">明天打开页面就能看到它们，不用担心漏掉。</span>`;
  btns.innerHTML = `<button class="btn btn-primary" id="btnRolloverOK">我知道了</button>`;
  document.getElementById('btnRolloverOK').onclick = ()=>{
    modal.style.display = 'none';
    if(pendingRollover) rolloverUndone(pendingRollover);
    pendingRollover = null;
    btns.innerHTML = `
      <button class="btn btn-outline" id="btnNotDone">没学完</button>
      <button class="btn btn-primary" id="btnDone">学完了！</button>
    `;
    msg.textContent = '';
  };
  modal.style.display = 'flex';
}

function renderAll(){
  if(reviewMode!==null) return; // 复习模式下不刷新
  checkNewDay();
  renderDashboard();
  renderReviewEntry();
  renderReviewBanner();
  renderDailyContent();
  renderPhaseNav();
}

function renderAllReview(){
  checkNewDay();
  renderDashboard();
  renderReviewEntry();
  renderReviewBanner();
  renderDailyContentReview();
  renderPhaseNav();
}

function checkNewDay(){
  const now = todayStr();
  if(state.lastActiveDate && state.lastActiveDate !== now){
    // 新的一天: 结算昨天的状态
    if(state.todayCompleted){
      // 昨天点了"今天就到这" → 今天自动推进到下一天
      if(state.currentDay < 60) state.currentDay++;
      state.todayCheckedIn = false;
      state.todayCompleted = false;
      state.todayTaskStatus = {};
    } else if(state.todayCheckedIn){
      // 昨天开始学过但没点"结束学习"(直接关了页面) → 滚存未完成的任务
      const undoneTasks = [];
      const prevDayData = getDayData(state.currentDay);
      if(prevDayData){
        prevDayData.tasks.forEach((t,i)=>{
          const key = `${state.currentDay}-${i}`;
          if(state.todayTaskStatus[key] !== 'done'){
            undoneTasks.push({...t, fromDay:state.currentDay});
          }
        });
      }
      if(undoneTasks.length>0){
        state.rolloverTasks = [...undoneTasks, ...state.rolloverTasks.filter(r=>r.fromDay!==state.currentDay)];
        // 记账: 来源天已完成了几个任务(补齐checkRolloverCompletions的判定依据)
        state.rolloverSources[state.currentDay] = {
          done: (prevDayData ? prevDayData.tasks.length - undoneTasks.length : 0),
          total: (prevDayData ? prevDayData.tasks.length : 0)
        };
        // 和"没学完"一致,当天打卡不计入连续
        state.streak = Math.max(0,(state.streak||1)-1);
      } else if(prevDayData && prevDayData.tasks.length>0){
        // 任务全部勾完了但没点结束 → 视为当天完成
        state.completedDays[state.currentDay] = true;
      }
      if(state.currentDay < 60) state.currentDay++;
      state.todayCheckedIn = false;
      state.todayCompleted = false;
      state.todayTaskStatus = {};
    }
    // 昨天完全没打开/没开始 → 什么都不动,今天继续同一天(不制造虚假积压)
  }
  state.lastActiveDate = now;
  saveState(state);
}

function renderDashboard(){
  const d = getDayData(state.currentDay);
  const phase = d ? d.phase : 1;
  document.getElementById('stat-day').textContent = state.currentDay;
  document.getElementById('stat-streak').textContent = state.streak;
  document.getElementById('stat-done').textContent = Object.keys(state.completedDays).length;
  document.getElementById('stat-rate').textContent = Math.round(Object.keys(state.completedDays).length/60*100)+'%';

  // 连续打卡里程碑
  const ms = document.getElementById('streakMilestone');
  const s = state.streak||0;
  if(s>=30) ms.innerHTML = '<div class="streak-milestone">🏆 连续30天！这件事你已经比90%的人强了</div>';
  else if(s>=14) ms.innerHTML = '<div class="streak-milestone">🔥🔥🔥 坚持14天，习惯已经养成了</div>';
  else if(s>=7) ms.innerHTML = '<div class="streak-milestone">🔥🔥 连续7天，不容易</div>';
  else if(s>=3) ms.innerHTML = '<div class="streak-milestone">🔥 开始进入状态了</div>';
  else ms.innerHTML = '';

  // 阶段进度条
  const bar = document.getElementById('phaseBar');
  bar.innerHTML = '';
  for(let p=1;p<=4;p++){
    const seg = document.createElement('div');
    seg.className = 'phase-seg';
    const total = getDaysInPhase(p);
    const done = getCompletedDaysInPhase(p, state.completedDays);
    if(done===total && total>0) seg.classList.add('done');
    if(p===phase) seg.classList.add('current');
    seg.title = `${getPhaseName(p)}: ${done}/${total}`;
    bar.appendChild(seg);
  }
}

function renderDailyContent(){
  const container = document.getElementById('dailyContent');

  // 清理脏数据：滚存任务里来自当前天的不是"昨天的"，直接移除
  if(state.rolloverTasks.some(r=>r.fromDay===state.currentDay)){
    state.rolloverTasks = state.rolloverTasks.filter(r=>r.fromDay!==state.currentDay);
    saveState(state);
  }

  const d = getDayData(state.currentDay);
  const phase = d ? d.phase : 1;
  const weekend = isWeekend();

  let html = '';

  // 周末提示
  if(weekend){
    html += `<div class="card weekend-banner">
      <div class="icon">☕</div>
      <strong>弹性日</strong><br>
      <span style="color:var(--sub);font-size:.85rem">今天是周末,没有排新内容。补上本周未完成的任务,或者给自己放个假。</span>
    </div>`;
  }

  // 主课程卡片
  html += `<div class="card">
    <div class="card-header">
      <div class="day-title-row">
        <span class="badge badge-phase${phase}">${getPhaseName(phase)}</span>
        <span class="card-title">Day ${state.currentDay}${weekend?' · 弹性日':''}: ${d?d.title:'自由练习'}</span>
      </div>
      ${state.todayCheckedIn ? '<span class="badge badge-done">已签到</span>' : ''}
    </div>`;

  if(d && d.goal){
    html += `<div class="day-goal">🎯 ${d.goal}</div>`;
  }

  // 保姆级教程(可折叠)
  const tuts = TUTORIALS[state.currentDay];
  if(tuts && tuts.length>0){
    html += `<button class="tutorial-toggle" onclick="toggleTutorial(this)" id="tutorialToggle">
      <span class="arrow">▶</span> 📖 保姆级教程（${tuts.length}个小节，点击展开）
    </button>`;
    html += `<div class="tutorial-body" id="tutorialBody" style="display:none">`;
    tuts.forEach(sec=>{
      html += `<div class="tutorial-section">
        <h4>${sec.title}</h4>
        <p>${sec.body.replace(/\n/g,'<br>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>')}</p>
      </div>`;
    });
    html += `</div>`;
  }

  // 配套练习文件/资料下载(练习文件、备用数据CSV、数据导出指南)
  const practiceFile = PRACTICE_FILES[state.currentDay];
  if(practiceFile){
    html += `<a href="practice-files/${practiceFile}" download style="display:inline-block;margin-bottom:10px;padding:7px 16px;background:var(--accent);color:#fff;border-radius:6px;font-size:.82rem;text-decoration:none;">📥 下载配套练习文件/资料</a>`;
  }

  // Rollover任务
  if(state.rolloverTasks.length>0){
    html += `<div class="section-label">📌 积压未完成的任务</div><ul class="task-list">`;
    state.rolloverTasks.forEach((t,i)=>{
      html += renderTaskItem(t, `rollover-${i}`, true);
    });
    html += `</ul>`;
  }

  // 当日任务（排除来自其他天的滚存任务,避免同任务在上下两个区域都出现）
  if(!weekend && d){
    const rolloverTextsFromOtherDays = new Set(
      state.rolloverTasks.filter(r=>r.fromDay!==state.currentDay).map(r=>r.text)
    );
    const freshTasks = d.tasks.filter(t=>!rolloverTextsFromOtherDays.has(t.text));
    if(freshTasks.length > 0){
      html += `<div class="section-label">📋 今日任务</div><ul class="task-list">`;
      freshTasks.forEach((t,i)=>{
        const key = `${state.currentDay}-${i}`;
        html += renderTaskItem(t, key, false);
      });
      html += `</ul>`;
    } else {
      html += `<div class="empty-state">
        <div class="icon">✅</div>
        <p>今日任务已全部完成！</p>
      </div>`;
    }
  }else if(weekend && state.rolloverTasks.length===0){
    html += `<div class="empty-state">
      <div class="icon">🎉</div>
      <p>没有积压任务！休息一下,或者回顾本周学过的内容。</p>
    </div>`;
  }

  // 今日思考题(主动回忆式巩固)
  html += renderThinking(state.currentDay, false);

  // 操作按钮
  // 计时器环
  html += `<div class="timer-ring-wrap" id="timerRingWrap" style="display:none">
    <div class="timer-ring">
      <svg width="60" height="60" viewBox="0 0 60 60">
        <circle class="timer-ring-bg" cx="30" cy="30" r="26"/>
        <circle class="timer-ring-fill" id="timerRingFill" cx="30" cy="30" r="26" stroke-dasharray="163.36" stroke-dashoffset="163.36"/>
      </svg>
      <div class="timer-ring-text" id="timerRingText">0:00</div>
    </div>
    <span style="font-size:.8rem;color:var(--sub)">目标约${getDayEstimate()}分钟</span>
  </div>`;
  html += `<div class="actions-row">`;
  if(!state.todayCheckedIn){
    html += `<button class="btn btn-primary btn-block" id="btnCheckin" onclick="checkin()">📖 开始学习</button>`;
  }else if(state.todayCompleted){
    // 今天就到这之后:显示回顾模式+提前进入下一天
    html += `<button class="btn btn-outline btn-block" onclick="completeDay()">⏭️ 提前进入下一天</button>`;
  }else{
    html += `<button class="btn btn-outline btn-block" id="btnCheckout" onclick="checkout()">✅ 结束学习</button>`;
  }
  html += `</div>`;

  // 跳过按钮(周末或弹性日)
  if(weekend && state.rolloverTasks.length===0){
    html += `<div class="actions-row" style="margin-top:6px">
      <button class="btn btn-outline btn-sm btn-block" onclick="skipDay()">跳过今天(标记完成)</button>
    </div>`;
  }

  html += `</div>`;

  container.innerHTML = html;

  // 恢复任务勾选状态
  if(d){
    d.tasks.forEach((t,i)=>{
      const key = `${state.currentDay}-${i}`;
      if(state.todayTaskStatus[key]==='done'){
        const el = document.getElementById(`task-${key}`);
        if(el) el.classList.add('checked');
        const cb = document.getElementById(`cb-${key}`);
        if(cb) cb.classList.add('done');
      }
    });
  }

  // 恢复计时器环(勾选任务会重建页面元素,计时器不能丢)
  updateTimerUI();
}

function renderTaskItem(t, key, isRollover){
  const done = state.todayTaskStatus[key]==='done';
  return `<li class="task-item${done?' checked':''}${isRollover?' rollover':''}" id="task-${key}" onclick="toggleTask('${key}')">
    <div class="task-checkbox${done?' done':''}" id="cb-${key}"></div>
    <div class="task-body">
      <div class="task-text">${t.text}</div>
      ${t.res ? `<div class="task-resource">${t.resUrl ? `<a href="${t.resUrl}" target="_blank" onclick="event.stopPropagation()">${t.res}</a>` : t.res}</div>` : ''}
      ${t.time ? `<div class="task-time">⏱️ 预计${t.time}</div>` : ''}
    </div>
  </li>`;
}

function renderPhaseNav(){
  const container = document.getElementById('phaseList');
  // 构建阶段→天数映射
  const phaseDays = {};
  CURRICULUM.forEach(d=>{if(!phaseDays[d.phase])phaseDays[d.phase]=[];phaseDays[d.phase].push(d.day);});
  let html = '';
  for(let p=1;p<=4;p++){
    const total = (phaseDays[p]||[]).length;
    const done = (phaseDays[p]||[]).filter(dn=>state.completedDays[dn]).length;
    const isCurrent = getDayData(state.currentDay)?.phase === p;
    const expanded = window._expandedPhase === p;
    html += `<div class="phase-row" style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)" onclick="togglePhaseExpand(${p})">
      <span style="font-size:.7rem;transition:transform .2s;display:inline-block;${expanded?'transform:rotate(90deg)':''}">▶</span>
      <span class="badge badge-${getPhaseColor(p)}">${getPhaseName(p)}</span>
      <span style="flex:1;font-size:.85rem">${done}/${total} 天完成</span>
      ${isCurrent ? '<span style="color:var(--accent);font-size:.75rem">← 当前</span>' : ''}
    </div>`;
    if(expanded){
      html += `<div class="phase-days">`;
      (phaseDays[p]||[]).forEach(dn=>{
        const dd = getDayData(dn);
        if(!dd) return;
        const doneDay = !!state.completedDays[dn];
        const isCur = dn===state.currentDay;
        const hasTut = !!TUTORIALS[dn];
        const hasQuiz = !!QUIZZES[dn];
        let icons = '';
        if(hasTut) icons+='📖';
        if(hasQuiz) icons+='📝';
        html += `<div class="phase-day-item${doneDay?' completed':''}${isCur?' current':''}" onclick="event.stopPropagation();enterPreviewOrReview(${dn})">
          Day ${dn} ${doneDay?'✅':''} ${dd.title}
          <span class="day-icons">${icons}</span>
        </div>`;
      });
      html += `</div>`;
    }
  }
  container.innerHTML = html;
}

function togglePhaseExpand(p){
  window._expandedPhase = (window._expandedPhase===p) ? 0 : p;
  renderPhaseNav();

function renderDailyContentReview(){

  html += `<div class="card">
    <div class="card-header">
      <div class="day-title-row">
        <span class="badge badge-phase${phase}">${getPhaseName(phase)}</span>
        <span class="card-title">Day ${reviewMode}: ${d.title}</span>
      </div>
      ${statusBadge}
    </div>`;

    html += `<div class="day-goal">🎯 ${d.goal}</div>`;
  }

  // 教程（默认展开）

  if(tuts && tuts.length>0){
    html += `<button class="tutorial-toggle open" onclick="toggleTutorial(this)" id="tutorialToggle">
      <span class="arrow">▼</span> 📖 保姆级教程（${tuts.length}个小节）
    </button>`;
    html += `<div class="tutorial-body" id="tutorialBody" style="display:block">`;
    tuts.forEach(sec=>{
      html += `<div class="tutorial-section">
        <h4>${sec.title}</h4>

      </div>`;
    });
    html += `</div>`;
  }

  // 配套练习文件/资料下载(复习模式)
  const practiceFileReview = PRACTICE_FILES[reviewMode];
  if(practiceFileReview){
    html += `<a href="practice-files/${practiceFileReview}" download style="display:inline-block;margin-bottom:10px;padding:7px 16px;background:var(--accent);color:#fff;border-radius:6px;font-size:.82rem;text-decoration:none;">📥 下载配套练习文件/资料</a>`;
  }

  d.tasks.forEach((t,i)=>{
    html += `<li class="task-item" style="cursor:default;opacity:0.8">

      <div class="task-body">
        <div class="task-text">${t.text}</div>
        ${t.res ? `<div class="task-resource">${t.resUrl ? `<a href="${t.resUrl}" target="_blank">${t.res}</a>` : t.res}</div>` : ''}
      </div>
    </li>`;
  });
  html += `</ul>`;

  // 测验：只有已完成的天才显示答案；未学习的只显示题目
  const qz = QUIZZES[reviewMode];
  if(qz){
    if(isCompleted){
      // 复习模式：显示答案和解析
      html += `<div class="section-label" style="margin-top:12px">📝 当日测验（${qz.questions.length}题）</div>`;
      qz.questions.forEach((q,qi)=>{
        html += `<div class="quiz-question" style="margin-bottom:12px">
          <div class="quiz-q-text" style="font-size:.85rem">${qi+1}. ${q.q}</div>`;
        q.opts.forEach((opt,oi)=>{
          const cls = oi===q.ans?'quiz-option correct':'quiz-option';
          html += `<div class="${cls}" style="pointer-events:none;font-size:.82rem">${String.fromCharCode(65+oi)}. ${opt} ${oi===q.ans?'✅':''}</div>`;
        });
        html += `<div class="quiz-explain">${q.why}</div></div>`;
      });
    } else {
      // 预览模式：只显示题目，不显示答案，并加锁提示
      html += `<div class="section-label" style="margin-top:12px">📝 当日测验（${qz.questions.length}题）</div>`;
      html += `<div style="text-align:center;padding:16px;color:var(--sub);font-size:.85rem;background:rgba(148,163,184,.06);border-radius:8px;border:1px dashed var(--border)">
        🔒 完成当日学习并打卡后，才能在这里回顾测验答案
      </div>`;
      html += `<div style="margin-top:10px">`;
      qz.questions.forEach((q,qi)=>{
        html += `<div class="quiz-question" style="margin-bottom:12px;opacity:0.55;pointer-events:none">
          <div class="quiz-q-text" style="font-size:.85rem">${qi+1}. ${q.q}</div>`;
        q.opts.forEach((opt,oi)=>{
          html += `<div class="quiz-option" style="font-size:.82rem">${String.fromCharCode(65+oi)}. ${opt}</div>`;
        });
        html += `</div>`;
      });
      html += `</div>`;
    }
  }

  // 思考题(复习模式下答案直接展开)
  html += renderThinking(reviewMode, true);

  html += `</div>`;
  container.innerHTML = html;
}

// ==================== 思考题 ====================
function renderThinking(dayNum, expanded){
  const qs = THINKING[dayNum];
  if(!qs || qs.length===0) return '';
  let html = `<div class="section-label" style="margin-top:14px">📝 今日思考题 · 先自己想再点开看答案</div>`;
  qs.forEach((item,qi)=>{
    html += `<button class="tutorial-toggle${expanded?' open':''}" onclick="toggleThinking(this)" style="margin-bottom:8px"><span class="arrow">${expanded?'▼':'▶'}</span> 思考题${qi+1}：${item.q}</button>`;
    html += `<div class="tutorial-body" style="display:${expanded?'block':'none'};margin-bottom:10px"><div class="quiz-explain">💡 ${item.a}</div></div>`;
  });

}

function toggleThinking(btn){
  const body = btn.nextElementSibling;
  if(!body) return;
  const isOpen = body.style.display !== 'none';
  if(isOpen){
    body.style.display = 'none';
    btn.classList.remove('open');
    btn.querySelector('.arrow').textContent = '▶';
  }else{
    body.style.display = 'block';
    btn.classList.add('open');
    btn.querySelector('.arrow').textContent = '▼';
  }
}

// ==================== 教程折叠 ====================
function toggleTutorial(btn){
  const body = document.getElementById('tutorialBody');
  if(!body) return;
  const isOpen = body.style.display !== 'none';
  if(isOpen){

// 计时器状态(不持久化: 刷新页面后从0重新计)
let timerElapsed = 0;
let timerInterval = null;
const TIMER_CIRCUM = 163.36; // 2*π*26

function stopTimer(){
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
}

function timerTick(){
  timerElapsed++;
  const totalSec = getDayEstimate()*60;
  const ratio = Math.min(timerElapsed/totalSec, 1);
  // 每次按id取最新元素: 页面重渲染后旧元素会被替换,不能缓存引用
  const fill = document.getElementById('timerRingFill');
  const text = document.getElementById('timerRingText');
  if(fill) fill.style.strokeDashoffset = TIMER_CIRCUM*(1-ratio);
  if(fill && ratio>=1) fill.style.stroke = 'var(--done)';
  if(text){
    const m = Math.floor(timerElapsed/60);
    const s = timerElapsed%60;
    text.textContent = `${m}:${String(s).padStart(2,'0')}`;
  }
}

function updateTimerUI(){
  // 渲染后恢复计时器环的显示状态(勾选任务等操作会重建页面元素)
  const wrap = document.getElementById('timerRingWrap');
  if(!wrap) return;
  if(timerInterval){
    wrap.style.display = 'flex';
    const fill = document.getElementById('timerRingFill');
    const text = document.getElementById('timerRingText');
    const totalSec = getDayEstimate()*60;
    const ratio = Math.min(timerElapsed/totalSec, 1);
    if(fill){
      fill.style.strokeDasharray = TIMER_CIRCUM;
      fill.style.strokeDashoffset = TIMER_CIRCUM*(1-ratio);
      if(ratio>=1) fill.style.stroke = 'var(--done)';
    }
    if(text){
      const m = Math.floor(timerElapsed/60);
      const s = timerElapsed%60;
      text.textContent = `${m}:${String(s).padStart(2,'0')}`;
    }
  }else{
    wrap.style.display = 'none';
  }
}

function startTimer(){
  stopTimer();
  timerElapsed = 0;
  timerInterval = setInterval(timerTick, 1000);
  updateTimerUI();
}

// ==================== 测验系统 ====================
function openQuiz(quiz){
  const modal = document.getElementById('quizModal');
  const qDiv = document.getElementById('quizQuestions');
  const resultDiv = document.getElementById('quizResult');
  const submitBtn = document.getElementById('btnQuizSubmit');
  const titleEl = document.getElementById('quizTitle');
  const subEl = document.getElementById('quizSub');

  resultDiv.style.display = 'none';
  submitBtn.disabled = true;
  const passingPercent = quiz.passing || 70;
  const passingCount = Math.ceil(quiz.questions.length * passingPercent / 100);

  titleEl.textContent = `📝 Day ${state.currentDay} 今日测验`;
  subEl.textContent = `共 ${quiz.questions.length} 题，答对 ${passingCount} 题(≥${passingPercent}%)即可通关`;

  let html = '';
  quiz.questions.forEach((q,qi)=>{
    html += `<div class="quiz-question">
      <div class="quiz-q-text">${qi+1}. ${q.q}</div>`;
    q.opts.forEach((opt,oi)=>{
      html += `<button class="quiz-option" data-q="${qi}" data-o="${oi}" onclick="selectOption(this,${qi},${oi})">${String.fromCharCode(65+oi)}. ${opt}</button>`;
    });
    html += `</div>`;
  });
  qDiv.innerHTML = html;

  // 存储当前测验引用
  window._currentQuiz = {quiz, answers:{}, answered:0, total:quiz.questions.length, passing:passingPercent};

  // 跳过按钮
  document.getElementById('btnQuizSkip').onclick = ()=>{
    modal.style.display = 'none';
    const d = getDayData(state.currentDay);
    // 按实际勾选状态计算未完成数,而不是把全部任务都算成未完成
    let undoneCount = 0;
    if(d){
      d.tasks.forEach((t,i)=>{
        if(state.todayTaskStatus[`${state.currentDay}-${i}`]!=='done') undoneCount++;
      });
    }
    showRolloverConfirm(undoneCount, d);
  };

  // 提交按钮
  submitBtn.onclick = ()=>gradeQuiz();
  submitBtn.textContent = '提交答案';
  submitBtn.className = 'btn btn-primary';

  modal.style.display = 'flex';
}

function selectOption(btn, qi, oi){
  const quizData = window._currentQuiz;
  if(!quizData || quizData.submitted) return;
  // 取消同题其他选项
  const qDiv = btn.parentElement;
  qDiv.querySelectorAll('.quiz-option').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
  quizData.answers[qi] = oi;
  // 统计已答题数
  quizData.answered = Object.keys(quizData.answers).length;
  // 全部答完才允许提交
  document.getElementById('btnQuizSubmit').disabled = quizData.answered < quizData.total;
}

function gradeQuiz(){
  const quizData = window._currentQuiz;
  if(!quizData) return;
  quizData.submitted = true;

  const {quiz, answers} = quizData;
  let correctCount = 0;

  // 标记每道题
  quiz.questions.forEach((q,qi)=>{
    const userAns = answers[qi];
    const correctIdx = q.ans;
    const qDiv = document.getElementById('quizQuestions').querySelectorAll('.quiz-question')[qi];
    if(!qDiv) return;
    const opts = qDiv.querySelectorAll('.quiz-option');
    opts.forEach((b,oi)=>{
      b.style.pointerEvents = 'none';
      if(oi===correctIdx) b.classList.add('correct');
      if(oi===userAns && oi!==correctIdx) b.classList.add('wrong');
    });
    if(userAns===correctIdx) correctCount++;
  });

  const passingCount = Math.ceil(quiz.questions.length * quizData.passing / 100);
  const passed = correctCount >= passingCount;
  const resultDiv = document.getElementById('quizResult');
  resultDiv.style.display = 'block';

  let resultHtml = `<div class="quiz-score">${passed?'✅':'❌'} ${correctCount}/${quizData.total}</div>`;
  resultHtml += `<div class="quiz-result ${passed?'pass':'fail'}">${passed?'🎉 及格！':'📚 不及格——需要复习后重试'}</div>`;

  // 每题解析
  quiz.questions.forEach((q,qi)=>{
    const userAns = answers[qi];
    const icon = userAns===q.ans?'✅':'❌';
    resultHtml += `<div class="quiz-explain">${icon} <strong>第${qi+1}题:</strong> ${q.why}</div>`;
  });

  resultDiv.innerHTML = resultHtml;

  // 更新按钮
  const submitBtn = document.getElementById('btnQuizSubmit');
  submitBtn.style.display = 'none';
  document.getElementById('btnQuizSkip').style.display = 'none';

  const btnsDiv = document.getElementById('quizBtns');
  if(passed){
    btnsDiv.innerHTML = `
      <button class="btn btn-outline" onclick="stayToday();document.getElementById('quizModal').style.display='none'">📌 今天就到这</button>
      <button class="btn btn-primary" onclick="fireConfetti();setTimeout(()=>{completeDay();document.getElementById('quizModal').style.display='none'},200)">继续下一天 →</button>`;
  }else{
    btnsDiv.innerHTML = `<button class="btn btn-outline" onclick="retryQuiz()">重新学习,稍后再测</button>`;
  }
}

function retryQuiz(){
  // 测验不通过不推进: 留在当天,已勾的任务保留,
  // 复习教程后重新点"结束学习"即可重测
  document.getElementById('quizModal').style.display = 'none';
}

function showDayEndChoice(){

  const msg = document.getElementById('modalMsg');
  msg.innerHTML = '✅ 今日学习完成！<br><span style="color:var(--sub);font-size:.82rem">要继续下一天,还是今天就到这?</span>';

    <button class="btn btn-primary" id="btnNext">继续下一天 →</button>
  `;
  document.getElementById('btnStay').onclick = ()=>{

      <button class="btn btn-outline" id="btnNotDone">没学完</button>

      <button class="btn btn-primary" id="btnDone">学完了！</button>
    `;
    completeDay();
  };
  document.getElementById('checkoutModal').style.display = 'flex';
}

function stayToday(){
  // 标记今天已完成，但不推进天数——明天还能回来看今天的内容
  // 先检查滚存任务是否补完了来源天（必须在清空todayTaskStatus之前）
  checkRolloverCompletions();
  state.completedDays[state.currentDay] = true;
  state.todayCheckedIn = true;
  state.todayCompleted = true;
  state.todayTaskStatus = {};
  state.rolloverTasks = state.rolloverTasks.filter(r=>r.fromDay!==state.currentDay);
  saveState(state);
  renderAll();
}

function completeDay(){
  // 先检查滚存任务是否补完了来源天（必须在清空todayTaskStatus之前）
  checkRolloverCompletions();
  state.completedDays[state.currentDay] = true;
  state.todayCheckedIn = false;
  state.todayCompleted = false;
  state.todayTaskStatus = {};
  // 只清除当前天的rollover,保留其他天积累的
  state.rolloverTasks = state.rolloverTasks.filter(r=>r.fromDay!==state.currentDay);
  // 统计今日完成天数
  const now = todayStr();
  if(state._completionsDate !== now){state._completionsDate=now;state._completionsToday=0;}
  state._completionsToday++;
  if(state.currentDay < 60) state.currentDay++;
  saveState(state);
  if(state._completionsToday >= 2){
    showPaceReminder();
  }else{
    renderAll();
  }
}

function showPaceReminder(){
  const toast = document.createElement('div');
  toast.id = 'paceToast';
  toast.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:18px 24px;z-index:300;text-align:center;max-width:400px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.5);animation:fadeInUp .4s ease';
  toast.innerHTML = `<div style="font-size:.9rem;margin-bottom:6px">⚡ 今天已完成 <strong>${state._completionsToday}</strong> 天内容，进入 Day ${state.currentDay}</div><div style="font-size:.8rem;color:var(--sub);margin-bottom:12px">学习需要消化，建议每天不超过 2 天新内容。<br>状态正好的话就继续冲。</div><button class="btn btn-primary btn-sm" id="btnPaceOK">继续学习</button>`;
  document.body.appendChild(toast);
  document.getElementById('btnPaceOK').onclick = ()=>{
    toast.remove();
    renderAll();
  };
}

function rolloverUndone(d){
  if(!d){
    // 如果没数据,只重置状态
    state.todayCheckedIn = false;
    state.todayCompleted = false;
    state.todayTaskStatus = {};
    if(state.currentDay < 60) state.currentDay++;
    saveState(state);
    renderAll();
    return;
  }
  const undone = [];
  d.tasks.forEach((t,i)=>{
    const key = `${state.currentDay}-${i}`;
    if(state.todayTaskStatus[key]!=='done'){
      undone.push({...t, fromDay:state.currentDay});
    }
  });
  // 记录来源天的完成进度：已经做了几个/总共几个
  const doneCount = d.tasks.length - undone.length;
  state.rolloverSources[state.currentDay] = {done: doneCount, total: d.tasks.length};
  state.rolloverTasks = [...state.rolloverTasks.filter(r=>r.fromDay!==state.currentDay), ...undone];
  state.todayCheckedIn = false;
  state.todayCompleted = false;
  state.todayTaskStatus = {};
  state.streak = Math.max(0,(state.streak||1)-1);
  if(state.currentDay < 60) state.currentDay++;
  saveState(state);
  renderAll();
}

// 检查滚存任务是否全部完成，如果是则标记来源天为已完成
function checkRolloverCompletions(){
  if(!state.rolloverSources) return;
  const daysToClear = [];
  Object.keys(state.rolloverSources).forEach(fromDay => {
    const src = state.rolloverSources[fromDay];
    // 统计该来源天在滚存任务中已完成的数量
    let rolloverDone = 0;
    state.rolloverTasks.forEach((r, i) => {
      if(r.fromDay == fromDay && state.todayTaskStatus[`rollover-${i}`]==='done'){
        rolloverDone++;
      }
    });
    // 已完成的(在原天做的) + 滚存补做的 >= 总数 → 标记该天完成
    if(src.done + rolloverDone >= src.total){
      state.completedDays[fromDay] = true;
      daysToClear.push(fromDay);
    }
  });
  // 清理已完成的来源天滚存任务和记录
  daysToClear.forEach(d => {
    state.rolloverTasks = state.rolloverTasks.filter(r => r.fromDay != d);
    delete state.rolloverSources[d];
  });
  if(daysToClear.length > 0) saveState(state);
}

function skipDay(){
  // 跳过周末/弹性日: 只标记当天完成,不清空其他天滚存的积压任务
  stopTimer();
  state.completedDays[state.currentDay] = true;
  state.todayCheckedIn = false;
  state.todayCompleted = false;
  state.todayTaskStatus = {};
  if(state.currentDay < 60){
    state.currentDay++;
  }
  saveState(state);
  renderAll();
}
